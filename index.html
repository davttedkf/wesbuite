
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STEVEN</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background:
        repeating-linear-gradient(
            0deg,
            #eeeeee 0px,
            #eeeeee 2px,
            #e7e7e7 3px
        );
    color: #000000;
    font-family: "Times New Roman", serif;
    font-size: 16px;
    overflow-x: hidden;
}

.page {
    width: 600px;
    max-width: calc(100% - 12px);
    margin: 15px auto;
    background: #eeeeee;
    border: 3px double #000000;
    box-shadow: 4px 4px 0 #555555;
    position: relative;
}

/* OLD COMPUTER HEADER */

.header {
    background: #c0c0c0;
    border-bottom: 3px double #000000;
    padding: 8px;
    color: #000080;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* LITTLE CORRUPTION */

.header::after {
    content: " // ERROR";
    color: #800000;
    font-size: 12px;
    margin-left: 8px;
}

.content {
    padding: 12px;
}

/* LOGIN */

.login {
    width: 400px;
    max-width: 100%;
    margin: 5px auto 20px auto;
    padding: 12px;
    background: #d4d0c8;
    border: 3px ridge #ffffff;
    box-shadow: 2px 2px 0 #555555;
}

.login-title {
    background: #000080;
    color: white;
    padding: 4px 6px;
    font-weight: bold;
    margin-bottom: 12px;
    font-family: "Courier New", monospace;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 8px;
    margin-bottom: 3px;
}

input {
    width: 100%;
    height: 30px;
    border: 2px inset #ffffff;
    background: #ffffff;
    padding: 4px;
    font-family: "Times New Roman", serif;
    font-size: 16px;
}

button {
    margin-top: 12px;
    padding: 5px 20px;
    background: #c0c0c0;
    border: 2px outset #ffffff;
    font-family: "Times New Roman", serif;
    font-size: 16px;
}

button:active {
    border: 2px inset #ffffff;
}

#message {
    margin-top: 10px;
    min-height: 20px;
    font-weight: bold;
}

/* PHOTOS */

.photos {
    border-top: 2px solid #000000;
    padding-top: 10px;
    text-align: center;
}

.photos img {
    width: 30%;
    max-width: 170px;
    margin: 4px;
    border: 2px solid #000000;
    filter: contrast(115%) grayscale(10%);
}

/* DISTORTION */

.photos img:nth-child(2) {
    transform: rotate(-1deg) skewX(1deg);
}

.photos img:nth-child(3) {
    transform: rotate(1deg) skewY(-1deg);
}

.photos img:nth-child(5) {
    transform: rotate(-2deg);
}

.photos img:nth-child(6) {
    transform: rotate(1deg) skewX(-1deg);
}

/* DARK OLD FOOTER */

.footer {
    margin-top: 12px;
    padding: 7px;
    border-top: 3px double #000000;
    background: #c0c0c0;
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: #333333;
}

/* SUBTLE SCREEN CORRUPTION */

.page::before {
    content: "";
    position: absolute;
    left: -2px;
    right: 3px;
    top: 118px;
    height: 2px;
    background: #550000;
    opacity: 0.35;
}

.page::after {
    content: "";
    position: absolute;
    width: 70px;
    height: 12px;
    right: 10px;
    top: 8px;
    background: #777777;
    opacity: 0.08;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        font-size: 15px;
    }

    .page {
        width: 100%;
        max-width: none;
        margin: 5px auto;
        box-shadow: 2px 2px 0 #555555;
    }

    .header {
        font-size: 21px;
        padding: 7px;
    }

    .content {
        padding: 8px;
    }

    .login {
        width: 100%;
        padding: 10px;
    }

    .login-title {
        font-size: 15px;
    }

    input {
        height: 34px;
        font-size: 16px;
    }

    button {
        width: 100%;
        min-height: 38px;
    }

    .photos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
    }

    .photos img {
        width: 100%;
        max-width: none;
        margin: 0;
    }

    .footer {
        font-size: 10px;
    }
}

@media (max-width: 350px) {

    .header {
        font-size: 18px;
    }

    .photos {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="header">
        STEVEN
    </div>

    <div class="content">

        <div class="login">

            <div class="login-title">
                LOGIN
            </div>

            <label>USERNAME:</label>
            <input type="text" id="username" autocomplete="off">

            <label>PASSWORD:</label>
            <input type="password" id="password" autocomplete="off">

            <button onclick="login()">LOGIN</button>

            <div id="message"></div>

        </div>

        <div class="photos">

            <img src="IMG_0226.jpeg">
            <img src="IMG_0333.jpeg">
            <img src="IMG_0751.jpeg">
            <img src="IMG_0752.jpeg">
            <img src="IMG_0753.jpeg">
            <img src="IMG_0754.jpeg">

        </div>

    </div>

    <div class="footer">
         &nbsp; | &nbsp;
    </div>

</div>

<audio id="music" loop>
    <source src="backgound music.mp3" type="audio/mpeg">
</audio>

<script>

function login() {

    const username =
        document.getElementById("username").value.toLowerCase();

    const password =
        document.getElementById("password").value.toLowerCase();

    const message =
        document.getElementById("message");

    if (
        username.includes("stevenlarrosa") ||
        password.includes("steven")
    ) {

        message.style.color = "green";
        message.textContent = "LOGIN ACCEPTED.";

    } else {

        message.style.color = "#800000";
        message.textContent = "ACCESS DENIED.";

    }

    const music = document.getElementById("music");

    music.play().catch(function() {});

}

document.addEventListener("click", function() {

    const music = document.getElementById("music");

    music.play().catch(function() {});

}, { once: true });

</script>

</body>
</html>
