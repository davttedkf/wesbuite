<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Sky Crash</title>

<style>
*{
    box-sizing:border-box;
    image-rendering:pixelated;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:monospace;
    background:#79c8f0;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(
        to bottom,
        #327fbd 0%,
        #5caee0 25%,
        #9ed2e8 65%,
        #cfe7ed 100%
    );
}

#sun{
    position:absolute;
    width:90px;
    height:90px;
    right:10%;
    top:8%;
    border-radius:50%;
    background:#fff0a3;
    box-shadow:
        0 0 0 14px rgba(255,240,163,.18),
        0 0 0 30px rgba(255,240,163,.08);
    z-index:1;
}

.cloud{
    position:absolute;
    height:20px;
    width:100px;
    background:#fff;
    opacity:.75;
    box-shadow:
        20px -16px 0 #fff,
        47px -22px 0 #fff,
        73px -8px 0 #fff,
        96px 0 0 #fff;
}

.cloud1{
    top:13%;
    left:-180px;
    animation:cloudMove 45s linear infinite;
}

.cloud2{
    top:29%;
    left:-250px;
    transform:scale(.8);
    animation:cloudMove 60s linear infinite;
    animation-delay:8s;
}

.cloud3{
    top:5%;
    left:-300px;
    transform:scale(.6);
    animation:cloudMove 75s linear infinite;
    animation-delay:20s;
}

.cloud4{
    top:41%;
    left:-220px;
    transform:scale(.9);
    animation:cloudMove 70s linear infinite;
    animation-delay:30s;
}

@keyframes cloudMove{
    from{left:-300px}
    to{left:110vw}
}

#distantCity{
    position:absolute;
    left:0;
    bottom:-15%;
    width:100%;
    height:55%;
    z-index:2;
    opacity:.22;
}

.distantBuilding{
    position:absolute;
    bottom:0;
    background:#506d81;
    border-top:4px solid #70899a;
}

.distantBuilding:after{
    content:"";
    position:absolute;
    inset:9px 6px;
    background:
        repeating-linear-gradient(
            to right,
            rgba(210,235,245,.65) 0 4px,
            transparent 4px 12px
        ),
        repeating-linear-gradient(
            to bottom,
            rgba(210,235,245,.6) 0 4px,
            transparent 4px 13px
        );
}

.db1{left:0;width:6%;height:48%}
.db2{left:6%;width:4%;height:67%}
.db3{left:11%;width:7%;height:42%}
.db4{left:18%;width:5%;height:72%}
.db5{left:24%;width:8%;height:55%}
.db6{left:33%;width:5%;height:78%}
.db7{left:39%;width:7%;height:47%}
.db8{left:47%;width:5%;height:69%}
.db9{left:54%;width:8%;height:51%}
.db10{left:63%;width:5%;height:75%}
.db11{left:69%;width:8%;height:43%}
.db12{left:78%;width:5%;height:66%}
.db13{left:84%;width:7%;height:53%}
.db14{left:92%;width:8%;height:71%}

#city{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:8;
}

.tower{
    position:absolute;
    width:175px;
    height:125%;
    bottom:-43%;
    background:
        repeating-linear-gradient(
            to right,
            #f7f8f8 0 15px,
            #d0d5d8 15px 19px,
            #ffffff 19px 35px
        );
    border-left:6px solid #a7afb4;
    border-right:6px solid #a7afb4;
    box-shadow:
        14px 0 0 rgba(48,58,65,.22),
        inset 0 0 30px rgba(70,80,90,.16);
    transform-origin:50% 100%;
}

.tower:before{
    content:"";
    position:absolute;
    inset:18px 12px;
    background:
        repeating-linear-gradient(
            to bottom,
            #405a6b 0 7px,
            #9db5c4 7px 11px,
            #314652 11px 15px,
            transparent 15px 28px
        );
    opacity:.94;
}

.tower:after{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:7px;
    transform:translateX(-50%);
    background:#bdc4c8;
    opacity:.8;
}

#tower1{
    left:27%;
}

#tower2{
    right:27%;
    height:128%;
    bottom:-46%;
}

.roof{
    position:absolute;
    top:-10px;
    left:-8px;
    width:calc(100% + 16px);
    height:10px;
    background:#858e94;
    border:3px solid #5e676d;
    z-index:4;
}

.antenna{
    position:absolute;
    bottom:100%;
    left:50%;
    width:5px;
    height:115px;
    transform:translateX(-50%);
    background:#5b646a;
    z-index:5;
}

.antenna:before{
    content:"";
    position:absolute;
    top:25px;
    left:-12px;
    width:29px;
    height:4px;
    background:#5b646a;
}

.antenna:after{
    content:"";
    position:absolute;
    top:60px;
    left:-5px;
    width:15px;
    height:4px;
    background:#5b646a;
}

/* COLLAPSE */

.towerCollapsing{
    animation:towerCollapse 4s steps(24) forwards;
}

@keyframes towerCollapse{

    0%{
        transform:scaleY(1) translateX(0);
    }

    12%{
        transform:scaleY(.995) translateX(-3px);
    }

    25%{
        transform:scaleY(.96) translateX(4px);
    }

    40%{
        transform:scaleY(.88) translateX(-5px);
    }

    55%{
        transform:scaleY(.73) translateX(6px);
    }

    70%{
        transform:scaleY(.54) translateX(-6px);
    }

    85%{
        transform:scaleY(.30) translateX(4px);
    }

    100%{
        transform:scaleY(.02) translateX(0);
        opacity:.1;
    }
}

.collapsePiece{
    position:absolute;
    z-index:75;
    background:#bfc5c8;
    border:3px solid #777f84;
    box-shadow:inset 5px 0 rgba(255,255,255,.35);
    animation:pieceFall 1.8s steps(12) forwards;
}

@keyframes pieceFall{

    0%{
        transform:translate(0,0) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
            translate(var(--dx),var(--dy))
            rotate(var(--rot));
        opacity:0;
    }
}

.collapseDust{
    position:absolute;
    width:45px;
    height:30px;
    background:#8b9295;
    opacity:.7;
    z-index:74;
    box-shadow:
        25px 5px 0 #777f82,
        -22px 10px 0 #969c9f,
        10px -13px 0 #a1a6a8;
    animation:dustRise 2.7s steps(12) forwards;
}

@keyframes dustRise{

    0%{
        transform:translate(0,0) scale(.5);
        opacity:.85;
    }

    45%{
        transform:translate(var(--dx),-50px) scale(1.6);
        opacity:.7;
    }

    100%{
        transform:
            translate(calc(var(--dx) * 1.7),-150px)
            scale(3.5);
        opacity:0;
    }
}

/* PLANE */

#plane{
    position:absolute;
    width:72px;
    height:38px;
    z-index:80;
    filter:drop-shadow(5px 6px 0 rgba(0,0,0,.22));
}

.planeBody{
    position:absolute;
    left:8px;
    top:12px;
    width:55px;
    height:15px;
    background:#f4f4f4;
    border:4px solid #333b42;
}

.planeBody:after{
    content:"";
    position:absolute;
    right:-13px;
    top:1px;
    border-left:14px solid #333b42;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
}

.planeWing{
    position:absolute;
    left:23px;
    top:5px;
    width:31px;
    height:9px;
    background:#cfd4d8;
    border:3px solid #333b42;
}

.planeWing2{
    position:absolute;
    left:24px;
    top:26px;
    width:27px;
    height:8px;
    background:#cfd4d8;
    border:3px solid #333b42;
}

.planeTail{
    position:absolute;
    left:9px;
    top:2px;
    width:13px;
    height:17px;
    background:#d7dadd;
    border:3px solid #333b42;
    clip-path:polygon(0 100%,100% 100%,65% 0);
}

.planeWindow,
.planeWindow2{
    position:absolute;
    top:15px;
    width:7px;
    height:6px;
    background:#4fa8df;
    border:2px solid #333b42;
}

.planeWindow{left:30px}
.planeWindow2{left:42px}

/* IMPACT */

.impactFlash{
    position:absolute;
    width:90px;
    height:90px;
    z-index:70;
    background:#fff5a0;
    clip-path:polygon(
        50% 0,
        63% 29%,
        100% 18%,
        72% 50%,
        100% 68%,
        60% 65%,
        52% 100%,
        42% 66%,
        0 80%,
        28% 51%,
        0 35%,
        39% 38%
    );
    animation:flash .22s steps(3) forwards;
}

@keyframes flash{
    from{
        transform:scale(.25);
        opacity:1;
    }

    to{
        transform:scale(2);
        opacity:0;
    }
}

.fire{
    position:absolute;
    width:32px;
    height:44px;
    z-index:62;
    animation:flicker .12s steps(2) infinite alternate;
}

.fire:before{
    content:"";
    position:absolute;
    left:5px;
    bottom:0;
    width:22px;
    height:40px;
    background:#ef3514;
    clip-path:polygon(
        50% 0,
        70% 20%,
        100% 40%,
        82% 100%,
        15% 100%,
        0 60%,
        29% 42%
    );
}

.fire:after{
    content:"";
    position:absolute;
    left:11px;
    bottom:3px;
    width:12px;
    height:26px;
    background:#ffd62b;
    clip-path:polygon(
        50% 0,
        100% 50%,
        72% 100%,
        15% 100%,
        0 55%
    );
}

@keyframes flicker{
    from{transform:scale(1)}
    to{transform:scale(1.1,.93) translateY(-2px)}
}

.fireGlow{
    position:absolute;
    width:65px;
    height:50px;
    background:#ff5217;
    opacity:.24;
    filter:blur(8px);
    z-index:60;
}

.smoke{
    position:absolute;
    width:38px;
    height:31px;
    background:#111416;
    opacity:.96;
    z-index:63;
    box-shadow:
        25px 5px 0 #1a1d20,
        -21px 9px 0 #0c0f11,
        13px -13px 0 #202428,
        -8px -18px 0 #171a1d,
        36px -10px 0 #25292c,
        -27px -3px 0 #131618;
    animation:smokeRise 4s steps(12) forwards;
}

@keyframes smokeRise{

    0%{
        transform:translate(0,0) scale(.55);
        opacity:1;
    }

    25%{
        transform:translate(var(--drift),-40px) scale(.9);
        opacity:.98;
    }

    55%{
        transform:
            translate(calc(var(--drift) * -1),-105px)
            scale(1.6);
        opacity:.94;
    }

    100%{
        transform:
            translate(var(--drift),-225px)
            scale(3);
        opacity:0;
    }
}

.debris{
    position:absolute;
    width:7px;
    height:7px;
    background:#686f73;
    z-index:65;
    animation:debris .9s steps(8) forwards;
}

@keyframes debris{

    from{
        transform:translate(0,0) rotate(0);
        opacity:1;
    }

    to{
        transform:
            translate(var(--dx),var(--dy))
            rotate(180deg);
        opacity:0;
    }
}

.spark{
    position:absolute;
    width:5px;
    height:5px;
    background:#ffe247;
    z-index:66;
    animation:spark .7s steps(7) forwards;
}

@keyframes spark{

    to{
        transform:translate(var(--sx),var(--sy));
        opacity:0;
    }
}

/* UI */

#status{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 14px;
    color:white;

#instructions{

@media(max-width:700px){

    }

</style>

<script>

const game=document.getElementById("game");
const plane=document.getElementById("plane");
const statusText=document.getElementById("status");
const resetButton=document.getElementById("resetButton");

const tower1=document.getElementById("tower1");
const tower2=document.getElementById("tower2");

const backgroundMusic=document.getElementById("backgroundMusic");

let x=0;
let y=0;
let vx=0;
let vy=0;

let crashed=false;
let smokeInterval=null;

function setStartPosition(){

    const w=window.innerWidth;
    const h=window.innerHeight;

    x=w*.035;
    y=h*.35;

    vx=2.5;
    vy=0;

    plane.style.left=x+"px";
    plane.style.top=y+"px";
    plane.style.transform="rotate(0deg)";
}

const keys={};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function holdButton(el,key){

    const down=e=>{
        e.preventDefault();
        keys[key]=true;
    };

    const up=e=>{
        e.preventDefault();
        keys[key]=false;
    };

    el.addEventListener("pointerdown",down);
    el.addEventListener("pointerup",up);
    el.addEventListener("pointerleave",up);
    el.addEventListener("pointercancel",up);
}

holdButton(document.getElementById("left"),"arrowleft");
holdButton(document.getElementById("right"),"arrowright");
holdButton(document.getElementById("up"),"arrowup");
holdButton(document.getElementById("down"),"arrowdown");

function updatePlane(){

    if(crashed)return;

    if(keys["arrowright"]||keys["d"])
        vx+=.42;

    if(keys["arrowleft"]||keys["a"])
        vx-=.42;

    if(keys["arrowup"]||keys["w"])
        vy-=.42;

    if(keys["arrowdown"]||keys["s"])
        vy+=.42;

    vx*=.93;
    vy*=.93;

    vx=Math.max(-7,Math.min(7,vx));
    vy=Math.max(-7,Math.min(7,vy));

    x+=vx;
    y+=vy;

    const maxX=window.innerWidth-plane.offsetWidth;
    const maxY=window.innerHeight-plane.offsetHeight;

    if(x<0){
        x=0;
        vx*=-.5;
    }

    if(x>maxX){
        x=maxX;
        vx*=-.5;
    }

    if(y<0){
        y=0;
        vy*=-.5;
    }

    if(y>maxY){
        y=maxY;
        vy*=-.5;
    }

    plane.style.left=x+"px";
    plane.style.top=y+"px";

    const angle=Math.max(
        -20,
        Math.min(20,vy*4)
    );

    plane.style.transform="rotate("+angle+"deg)";

    checkCollision();
}

function checkCollision(){

    const p=plane.getBoundingClientRect();

    for(const tower of [tower1,tower2]){

        if(tower.classList.contains("towerCollapsing"))
            continue;

        const t=tower.getBoundingClientRect();

        if(
            p.right>t.left &&
            p.left<t.right &&
            p.bottom>t.top &&
            p.top<t.bottom
        ){

            crash(tower,p);
            return;
        }
    }
}

function crash(tower,p){

    if(crashed)return;

    crashed=true;

    vx=0;
    vy=0;

    statusText.textContent="STATUS: IMPACT";

    const t=tower.getBoundingClientRect();

    const impactX=Math.max(
        t.left,
        Math.min(
            p.left+p.width/2,
            t.right
        )
    );

    const impactY=Math.max(
        t.top,
        Math.min(
            p.top+p.height/2,
            t.bottom
        )
    );

    /*
        Keep the plane visible at the impact point.
        It will move downward with the collapsing tower.
    */

    plane.style.display="block";
    plane.style.left=(impactX-p.width/2)+"px";
    plane.style.top=(impactY-p.height/2)+"px";
    plane.style.transform="rotate(0deg)";

    createImpact(impactX,impactY);
    createFire(impactX,impactY);
    createSmokeCloud(impactX,impactY);
    createDebris(impactX,impactY);

    smokeInterval=setInterval(()=>{

        if(!crashed){
            clearInterval(smokeInterval);
            return;
        }

        createSmoke(
            impactX+(Math.random()*55-27),
            impactY+(Math.random()*35-15)
        );

    },240);

    /*
        Wait before the fictional tower starts collapsing.
    */

    setTimeout(()=>{

        statusText.textContent="STATUS: STRUCTURAL FAILURE";

        collapseTower(
            tower,
            impactX,
            impactY
        );

    },8500);
}

function collapseTower(tower,impactX,impactY){

    if(tower.classList.contains("towerCollapsing"))
        return;

    tower.classList.add("towerCollapsing");

    const rect=tower.getBoundingClientRect();

    /*
        Plane follows the collapsing tower.

        The tower's bottom stays roughly fixed while
        the top moves downward, so the plane gradually
        moves toward the bottom with it.
    */

    const planeStartY=impactY-plane.offsetHeight/2;
    const planeEndY=rect.bottom-plane.offsetHeight/2-8;

    const planeX=impactX-plane.offsetWidth/2;

    const startTime=performance.now();
    const duration=4000;

    function movePlaneWithTower(now){

        if(!crashed)return;

        const progress=Math.min(
            1,
            (now-startTime)/duration
        );

        const eased=progress*progress*(3-2*progress);

        const newY=
            planeStartY+
            (planeEndY-planeStartY)*eased;

        /*
            Slight shaking while going down.
        */

        const shake=
            progress<.8
            ? Math.sin(now/45)*3
            : 0;

        plane.style.left=planeX+"px";
        plane.style.top=(newY+shake)+"px";

        if(progress<1){

            requestAnimationFrame(movePlaneWithTower);

        }else{

            plane.style.top=planeEndY+"px";

        }
    }

    requestAnimationFrame(movePlaneWithTower);

    /*
        Falling building pieces.
    */

    for(let i=0;i<38;i++){

        const piece=document.createElement("div");

        piece.className="collapsePiece";

        const width=8+Math.random()*22;
        const height=7+Math.random()*20;

        piece.style.width=width+"px";
        piece.style.height=height+"px";

        piece.style.left=
            rect.left+
            Math.random()*rect.width+
            "px";

        piece.style.top=
            rect.top+
            Math.random()*rect.height*.8+
            "px";

        piece.style.setProperty(
            "--dx",
            ((Math.random()-.5)*280)+"px"
        );

        piece.style.setProperty(
            "--dy",
            (70+Math.random()*240)+"px"
        );

        piece.style.setProperty(
            "--rot",
            ((Math.random()-.5)*720)+"deg"
        );

        game.appendChild(piece);

        setTimeout(()=>{
            piece.remove();
        },1900);
    }

    /*
        Dust.
    */

    for(let i=0;i<22;i++){

        setTimeout(()=>{

            const dust=document.createElement("div");

            dust.className="collapseDust";

            dust.style.left=
                rect.left+
                Math.random()*rect.width+
                "px";

            dust.style.top=
                rect.bottom-
                20+
                "px";

            dust.style.setProperty(
                "--dx",
                ((Math.random()-.5)*170)+"px"
            );

            game.appendChild(dust);

            setTimeout(()=>{
                dust.remove();
            },2800);

        },i*130);
    }

    createCollapseSmoke(rect);

    /*
        Once the tower is completely down,
        stop ALL continuous smoke.
    */

    setTimeout(()=>{

        statusText.textContent="STATUS: COLLAPSED";

        clearInterval(smokeInterval);
        smokeInterval=null;

        removeAllEffects();

        tower.style.visibility="hidden";

        plane.style.display="none";

        resetButton.style.display="block";

    },4300);
}

function createImpact(x,y){

    const flash=document.createElement("div");

    flash.className="impactFlash";

    flash.style.left=(x-45)+"px";
    flash.style.top=(y-45)+"px";

    game.appendChild(flash);

    setTimeout(()=>{
        flash.remove();
    },250);

    for(let i=0;i<25;i++){

        const spark=document.createElement("div");

        spark.className="spark";

        spark.style.left=x+"px";
        spark.style.top=y+"px";

        spark.style.setProperty(
            "--sx",
            ((Math.random()-.5)*190)+"px"
        );

        spark.style.setProperty(
            "--sy",
            ((Math.random()-.5)*150)+"px"
        );

        game.appendChild(spark);

        setTimeout(()=>{
            spark.remove();
        },750);
    }
}

function createFire(x,y){

    const offsets=[
        [-24,-4,1],
        [0,-8,1.35],
        [24,-3,.95],
        [-13,24,.85],
        [14,25,1],
        [0,45,.75]
    ];

    for(const o of offsets){

        const fire=document.createElement("div");

        fire.className="fire";

        fire.style.left=
            (x+o[0]-16)+"px";

        fire.style.top=
            (y+o[1]-40)+"px";

        fire.style.transform=
            "scale("+o[2]+")";

        game.appendChild(fire);

        const glow=document.createElement("div");

        glow.className="fireGlow";

        glow.style.left=
            (x+o[0]-32)+"px";

        glow.style.top=
            (y+o[1]-24)+"px";

        game.appendChild(glow);
    }
}

function createSmoke(x,y){

    const smoke=document.createElement("div");

    smoke.className="smoke";

    smoke.style.left=(x-19)+"px";
    smoke.style.top=(y-18)+"px";

    smoke.style.setProperty(
        "--drift",
        ((Math.random()-.5)*85)+"px"
    );

    game.appendChild(smoke);

    setTimeout(()=>{
        smoke.remove();
    },4100);
}

function createSmokeCloud(x,y){

    for(let i=0;i<9;i++){

        createSmoke(
            x+(Math.random()*55-27),
            y+(Math.random()*35-12)
        );
    }
}

function createCollapseSmoke(rect){

    for(let i=0;i<18;i++){

        setTimeout(()=>{

            if(!crashed)return;

            createSmoke(
                rect.left+
                rect.width/2+
                (Math.random()-.5)*rect.width,
                rect.bottom-
                Math.random()*140
            );

        },i*160);
    }
}

function createDebris(x,y){

    for(let i=0;i<20;i++){

        const d=document.createElement("div");

        d.className="debris";

        d.style.left=x+"px";
        d.style.top=y+"px";

        d.style.setProperty(
            "--dx",
            ((Math.random()-.5)*190)+"px"
        );

        d.style.setProperty(
            "--dy",
            ((Math.random()-.8)*150)+"px"
        );

        game.appendChild(d);

        setTimeout(()=>{
            d.remove();
        },950);
    }
}

function removeAllEffects(){

    document.querySelectorAll(
        ".fire,"+
        ".fireGlow,"+
        ".smoke,"+
        ".spark,"+
        ".debris,"+
        ".impactFlash,"+
        ".collapsePiece,"+
        ".collapseDust"
    ).forEach(el=>{
        el.remove();
    });
}

resetButton.addEventListener("click",()=>{

    crashed=false;

    clearInterval(smokeInterval);
    smokeInterval=null;

    removeAllEffects();

    tower1.classList.remove("towerCollapsing");
    tower2.classList.remove("towerCollapsing");

    tower1.style.visibility="visible";
    tower2.style.visibility="visible";

    plane.style.display="block";

    statusText.textContent="STATUS: FLYING";

    resetButton.style.display="none";

    setStartPosition();

    backgroundMusic.currentTime=0;

    backgroundMusic.play().catch(()=>{});

});

window.addEventListener("resize",()=>{

    if(!crashed)
        setStartPosition();

});

setStartPosition();

backgroundMusic.volume=.6;

backgroundMusic.play().catch(()=>{});

function loop(){

    updatePlane();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
