<body><canvas id="c" width="640" height="400"></canvas><div id="msg"></div><script>

  // extra detail pillars/structure for a busier, more interesting map

function cell(x,y){return map[Math.floor(y)]?.[Math.floor(x)]??1;}
let doors=[],enemies=[],items=[],shots=[],bits=[],tracers=[];
function door(x,y){return doors.find(d=>d.x===Math.floor(x)&&d.y===Math.floor(y));}
function solid(x,y,r=.1){
  for(const p of [[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]]){
    let t=cell(...p),d=door(...p);
    if(t>=5&&t<=8){ if(!d||d.open<0.9) return true; }
    else if(t&&t!=='0'&&t!==0) return true;
  }
  return false;
}
function move(o,dx,dy,r){ if(!solid(o.x+dx,o.y,r))o.x+=dx; if(!solid(o.x,o.y+dy,r))o.y+=dy; }
function clear(x,y,tx,ty){
  let a=Math.atan2(ty-y,tx-x),d=Math.hypot(tx-x,ty-y);
  for(let q=.08;q<d;q+=.18) if(solid(x+Math.cos(a)*q,y+Math.sin(a)*q,.02)) return false;
  return true;
}
function rayDist(x,y,a,maxDist){ let d=0; while(d<maxDist){ d+=.08; if(solid(x+Math.cos(a)*d,y+Math.sin(a)*d,.02)) return d; } return maxDist; }
function randomFloorPos(){
  for(let tries=0;tries<80;tries++){
    let x=R(2,MW-2), y=R(2,MH-2);
    if(cell(x,y)==='0' && D({x,y},P)>4) return {x,y};

}

function mkTex(w,h,fn){ let cv=document.createElement('canvas'); cv.width=w; cv.height=h; let g=cv.getContext('2d'); g.imageSmoothingEnabled=false; fn(g,w,h); return cv; }

/* ---------------------------------------------------------------------- *
 *  AUDIO - Beefy SFX, Panning, Door Sounds
 * ---------------------------------------------------------------------- */
class Sfx{
  constructor(){this.a=null;this.muted=false;this.masterFilter=null;}
  on(){ if(!this.a){ this.a=new (window.AudioContext||webkitAudioContext)(); this.masterFilter=this.a.createBiquadFilter(); this.masterFilter.type='lowpass'; this.masterFilter.frequency.value=20000; this.masterFilter.connect(this.a.destination);} this.a.resume?.(); }
  getPan(ax,ay){ let a=wrap(Math.atan2(ay-P.y,ax-P.x)-P.a); return Math.sin(a); }
  tone(f,d=.08,t='square',v=.07,s=0,pan=0){
    if(this.muted)return; this.on();
    const n=this.a.currentTime,o=this.a.createOscillator(),g=this.a.createGain(),p=this.a.createStereoPanner();
    o.type=t; f=f*(.96+Math.random()*.08);
    o.frequency.setValueAtTime(f,n); o.frequency.exponentialRampToValueAtTime(Math.max(20,f+s),n+d);
    g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(.001,n+d);
    p.pan.value=clamp(pan,-1,1);
    o.connect(g); g.connect(p); p.connect(this.masterFilter); o.start(n); o.stop(n+d);
    if(v>.04) this.noise(Math.min(.11,d),v*.4,f<100?300:Math.min(2800,f*6),pan);
  }
  noise(duration=.09,volume=.07,cutoff=1200,pan=0){
    if(this.muted)return; this.on();
    const n=this.a.currentTime,b=this.a.createBuffer(1,Math.ceil(this.a.sampleRate*duration),this.a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=this.a.createBufferSource(),filter=this.a.createBiquadFilter(),gain=this.a.createGain(),p=this.a.createStereoPanner();
    src.buffer=b; filter.type='lowpass'; filter.frequency.value=cutoff; p.pan.value=clamp(pan,-1,1);
    gain.gain.setValueAtTime(volume,n); gain.gain.exponentialRampToValueAtTime(.001,n+duration);
    src.connect(filter); filter.connect(gain); gain.connect(p); p.connect(this.masterFilter); src.start(n);
  }
  sweep(f1,f2,d=.4,v=.1,pan=0){
    if(this.muted)return; this.on();
    const n=this.a.currentTime,o=this.a.createOscillator(),g=this.a.createGain(),p=this.a.createStereoPanner();
    o.type='sine'; o.frequency.setValueAtTime(f1,n); o.frequency.linearRampToValueAtTime(f2,n+d);
    g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(.001,n+d); p.pan.value=clamp(pan,-1,1);
    o.connect(g); g.connect(p); p.connect(this.masterFilter); o.start(n); o.stop(n+d);
  }
  update(dt){ if(!this.a) return; let target = (P.hp<25 && state==='play') ? 600 : 20000; this.masterFilter.frequency.setTargetAtTime(target, this.a.currentTime, 0.1); }
}
const sfx=new Sfx();

class Music{
  constructor(){this.playing=false;this.step=0;this.next=0;this.timer=null;this.gain=null;}
  start(){ if(this.playing)return; sfx.on(); this.ctx=sfx.a; this.playing=true; this.step=0; this.next=this.ctx.currentTime+.1; this.gain=this.ctx.createGain(); this.gain.gain.value=sfx.muted?0:.15; this.gain.connect(sfx.masterFilter); this.schedule(); }
  schedule(){ 
    if(!this.playing)return; 
    if(this.next < this.ctx.currentTime - 1) this.next = this.ctx.currentTime + .1; 
    while(this.next<this.ctx.currentTime+.25){ this.beat(this.step,this.next); this.next+=.34; this.step++; } 
    this.timer=setTimeout(()=>this.schedule(),90); 
  }
  beat(i,t){
    const bass=[41.2,41.2,49,41.2,55,41.2,49,36.7,41.2,41.2,49,41.2,61.7,55,49,41.2];
    const note=bass[i%bass.length]*(1+Math.min(.3,(level-1)*.05));
    const o=this.ctx.createOscillator(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter();
    o.type='sawtooth'; o.frequency.setValueAtTime(note,t); f.type='lowpass'; f.frequency.setValueAtTime(420+((i%4)*160),t); f.Q.value=4;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.55,t+.015); g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.connect(f); f.connect(g); g.connect(this.gain); o.start(t); o.stop(t+.32);
    if(i%16===8){ const o2=this.ctx.createOscillator(),g2=this.ctx.createGain(); o2.type='square'; o2.frequency.setValueAtTime(note*4,t); g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(.07,t+.01); g2.gain.exponentialRampToValueAtTime(.001,t+.22); o2.connect(g2); g2.connect(this.gain); o2.start(t); o2.stop(t+.24); }
  }
  setMuted(m){ if(this.gain) this.gain.gain.setTargetAtTime(m?0:.15,this.ctx.currentTime,.15); }
  stop(){ this.playing=false; clearTimeout(this.timer); if(this.gain) this.gain.gain.setTargetAtTime(0,this.ctx.currentTime,.2); }
}
const music=new Music();

/* ---------------------------------------------------------------------- *
 *  ENTITIES
 * ---------------------------------------------------------------------- */
class Player{
  constructor(){ Object.assign(this,{x:3.5,y:3.5,a:0,pitch:0,vx:0,vy:0,hp:100,armor:0,ammo:60,w:1,gun:[1,1,0,0,0],
    key:{red:0,blue:0,yellow:0},cool:0,altCool:0,bob:0,hurt:0,recoil:0,shootAnim:0,turnSway:0,kills:0,shots:0, pickups:0, aimedEnemy:false, aimedDoor:null, step:false}); }
  update(dt){
    let f=(K.KeyW?1:0)-(K.KeyS?1:0), s=(K.KeyD?1:0)-(K.KeyA?1:0), l=Math.hypot(f,s)||1;
    if(K.ArrowLeft) this.a-=2.25*dt; if(K.ArrowRight) this.a+=2.25*dt; this.a=wrap(this.a);
    this.vx+=(Math.cos(this.a)*f+Math.cos(this.a+Math.PI/2)*s)/l*12*dt; this.vy+=(Math.sin(this.a)*f+Math.sin(this.a+Math.PI/2)*s)/l*12*dt;
    this.vx*=Math.exp(-7.2*dt); this.vy*=Math.exp(-7.2*dt); move(this,this.vx*dt,this.vy*dt,.22);
    if(Math.hypot(this.vx,this.vy)>.08) { this.bob+=dt*13; if(Math.sin(this.bob)>0.99&&!this.step){sfx.noise(.05,.03,150);this.step=true;} else if(Math.sin(this.bob)<0)this.step=false; }
    this.cool=Math.max(0,this.cool-dt); this.altCool=Math.max(0,this.altCool-dt); this.hurt=Math.max(0,this.hurt-dt);

    let px=Math.floor(this.x), py=Math.floor(this.y);

    let a=P.a+(w===2?R(-.18,.18):0), best=null, bd=range;
    for(const e of enemies) if(!e.dead){ let d=D(e,P), ad=Math.abs(wrap(Math.atan2(e.y-P.y,e.x-P.x)-a)); if(d<bd && ad<.065+.23/d && clear(P.x,P.y,e.x,e.y)){ best=e; bd=d; } }
    let endDist = best ? bd : rayDist(P.x,P.y,a,range);
    let ex=P.x+Math.cos(a)*endDist, ey=P.y+Math.sin(a)*endDist;

  }

    G.fillStyle='rgba(20,29,38,.95)'; G.fillRect(W/2+42,barY+7,96,barH-14); G.strokeStyle='rgba(94,216,255,.25)'; G.strokeRect(W/2+42,barY+7,96,barH-14);
    G.fillStyle=P.hp<=25?'#e63a2e':'#c9382b'; G.font='bold 20px monospace'; G.fillText(String(P.hp|0).padStart(3,'0')+'%', W/2+50, barY+32);
    G.fillStyle='#7ee8ff'; G.font='bold 8px monospace'; G.fillText('HEALTH',W/2+50,barY+46);

    G.fillStyle='rgba(20,29,38,.95)'; G.fillRect(W-100,barY+7,94,barH-14); G.strokeStyle='rgba(94,216,255,.25)'; G.strokeRect(W-100,barY+7,94,barH-14);
    G.fillStyle=P.armor===0?'#555':'#c9382b'; G.font='bold 20px monospace'; G.fillText(String(P.armor|0).padStart(3,'0')+'%', W-92, barY+32);
    G.fillStyle='#7ee8ff'; G.font='bold 8px monospace'; G.fillText('ARMOR',W-92,barY+46);

    /* ---- CIRCULAR MINIMAP ---- */
    const mmR=52, mmCX=W-mmR-12, mmCY=mmR+16, scale=3.1;
    G.save();
    G.beginPath(); G.arc(mmCX,mmCY,mmR,0,Math.PI*2); G.closePath(); G.clip();
    G.fillStyle='rgba(6,10,16,0.88)'; G.fillRect(mmCX-mmR,mmCY-mmR,mmR*2,mmR*2);
    let originX=mmCX-P.x*scale, originY=mmCY-P.y*scale;
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
      if(!explored[y][x]) continue; const t=map[y][x];
      G.fillStyle=t==='0'?'#242e36':t==='4'?'#38d95c':(t>='6'&&t<='8')?({6:'#bf3838',7:'#377bc9',8:'#d6bd36'}[t]):t==='1'?'#7a8794':t==='2'?'#3d5a63':'#7a3230';
      G.fillRect(originX+x*scale,originY+y*scale,scale+.5,scale+.5);
    }
    const mmColors = {health:'#e9ece2',armor:'#54dadd',ammo:'#d4b442',red:'#ef3b39',blue:'#4889f0',yellow:'#e8d23d',shotgun:'#aab0b3',plasma:'#4ae9ef',rocket:'#e57b31',exit:'#4cf06a'};
    for(const i of items) if(!i.taken && mmColors[i.k] && explored[Math.floor(i.y)]?.[Math.floor(i.x)]) { G.fillStyle = mmColors[i.k]; G.fillRect(originX+i.x*scale-1, originY+i.y*scale-1, 2, 2); }
    for(const e of enemies) if(!e.dead && explored[Math.floor(e.y)]?.[Math.floor(e.x)]){ G.fillStyle=e.boss?'#ff59ff':'#ed5a48'; G.fillRect(originX+e.x*scale-1,originY+e.y*scale-1,e.boss?4:3,e.boss?4:3); }
    G.restore();
    G.strokeStyle='rgba(200,180,140,0.5)'; G.lineWidth=2; G.beginPath(); G.arc(mmCX,mmCY,mmR,0,Math.PI*2); G.stroke();
    G.save(); G.translate(mmCX,mmCY); G.rotate(P.a); G.fillStyle='#f4f1d1'; G.beginPath(); G.moveTo(5,0); G.lineTo(-3,-3); G.lineTo(-1.5,0); G.lineTo(-3,3); G.fill(); G.restore();
    
    if (P.aimedDoor) {
      const doorText=P.aimedDoor.locked ? 'LOCKED // '+P.aimedDoor.key.toUpperCase()+' KEY REQUIRED' : 'SPACE // OPEN DOOR';
      G.font='bold 11px monospace'; const tw=G.measureText(doorText).width+22;
      G.fillStyle='rgba(7,13,19,.94)'; G.fillRect(W/2-tw/2,H/2+34,tw,24);
      G.strokeStyle=P.aimedDoor.locked?'rgba(255,82,82,.75)':'rgba(126,255,155,.7)'; G.strokeRect(W/2-tw/2+.5,H/2+34.5,tw-1,23);
      G.fillStyle=P.aimedDoor.locked?'#ff7272':'#8cffb0'; G.textAlign='center'; G.fillText(doorText,W/2,H/2+50); G.textAlign='left';
    }
    const danger=shots.some(q=>!q.f&&D(P,q)<2.7); if(danger){ G.strokeStyle='rgba(255,65,65,.9)'; G.lineWidth=2; G.strokeRect(W/2-13,H/2-13,26,26); }
    if(P.hp<=25){ G.fillStyle='rgba(255,30,30,.07)'; G.fillRect(0,0,W,H); G.fillStyle='#ff6a61'; G.font='bold 11px monospace'; G.textAlign='center'; G.fillText('LOW HEALTH',W/2,25); G.textAlign='left'; }
    if(P.w && P.ammo<=8){ G.fillStyle='#ffd35c'; G.font='bold 11px monospace'; G.textAlign='center'; G.fillText('LOW AMMO // '+String(P.ammo).padStart(2,'0'),W/2,42); G.textAlign='left'; }
    const nearExit=items.find(i=>i.k==='exit'&&!i.taken&&D(i,P)<2.4); if(nearExit){ G.fillStyle='rgba(7,13,19,.94)'; G.fillRect(W/2-100,H-82,200,22); G.strokeStyle='rgba(140,255,155,.6)'; G.strokeRect(W/2-99.5,H-81.5,199,21); G.fillStyle='#8cff9b'; G.font='bold 11px monospace'; G.textAlign='center'; G.fillText('SPACE // ESCAPE',W/2,H-67); G.textAlign='left'; }
    
    if(dmgTime > 0){ let alpha = clamp(dmgTime / 0.6, 0, 1); G.save(); G.translate(W/2, H/2 + P.pitch); G.rotate(dmgAngle); G.strokeStyle = `rgba(255,0,0,${alpha*0.8})`; G.lineWidth = 5; G.beginPath(); G.arc(0, 0, 120, -0.5, 0.5); G.stroke(); G.restore(); }
    
    let chGap = 4 + (P.cool * 20) + (Math.hypot(P.vx, P.vy) * 2);
    let chLen = 6; let cy = H/2 + P.pitch;
    G.strokeStyle = P.aimedEnemy ? 'rgba(255, 50, 50, 0.9)' : 'rgba(235,245,255,.75)'; G.lineWidth = 1;
    G.beginPath();
    G.moveTo(W/2 - chGap - chLen, cy); G.lineTo(W/2 - chGap, cy);
    G.moveTo(W/2 + chGap, cy); G.lineTo(W/2 + chGap + chLen, cy);
    G.moveTo(W/2, cy - chGap - chLen); G.lineTo(W/2, cy - chGap);
    G.moveTo(W/2, cy + chGap); G.lineTo(W/2, cy + chGap + chLen);
    G.stroke();
    if (P.aimedEnemy) { G.fillStyle = 'rgba(255, 50, 50, 0.9)'; G.fillRect(W/2-1, cy-1, 2, 2); }

    if (mark > 0) {
      const a=clamp(mark/.28,0,1), r=7+(1-a)*3;
      G.save(); G.translate(W/2,cy); G.lineWidth=2.2; G.lineCap='square';
      G.strokeStyle=`rgba(255,245,180,${a})`; G.shadowColor='rgba(255,190,40,.7)'; G.shadowBlur=5;
      G.beginPath();
      G.moveTo(-r-6,-r-6); G.lineTo(-r,-r);
      G.moveTo(r+6,-r-6); G.lineTo(r,-r);
      G.moveTo(-r-6,r+6); G.lineTo(-r,r);
      G.moveTo(r+6,r+6); G.lineTo(r,r);
      G.stroke(); G.shadowBlur=0;
      G.fillStyle=`rgba(255,220,90,${a*.9})`;
      G.beginPath(); G.moveTo(0,-2.5); G.lineTo(2.5,0); G.lineTo(0,2.5); G.lineTo(-2.5,0); G.closePath(); G.fill();
      G.restore();
    }
  }
}
const draw=new Render();

function overlay(){
  G.fillStyle='rgba(0,0,0,.8)'; G.fillRect(0,0,W,H); G.textAlign='center';
  if(state==='title'){ G.fillStyle='#e44335'; G.font='bold 48px monospace'; G.fillText('HELLGATE',W/2,100); G.fillStyle='#ffce69'; G.font='bold 16px monospace'; G.fillText('OVERKILL // RETRO FPS',W/2,128); G.fillStyle='#eee'; G.font='13px monospace'; G.fillText('WASD MOVE · MOUSE LOOK · LMB FIRE',W/2,168); G.fillText('RMB / E ALT-FIRE · SPACE USE · 1-5 WEAPONS',W/2,190); G.fillText('3 KEYCARDS OPEN THE VAULT — FIND THEM ALL TO ESCAPE',W/2,212); G.fillStyle='#ff8c69'; G.fillText('LEVELS GET HARDER THE FURTHER YOU GO',W/2,232); G.fillStyle='#fff5c2'; G.fillText('CLICK OR PRESS ENTER TO DROP IN',W/2,262); }
  else if(state==='pause'){ G.fillStyle='#fff'; G.font='bold 34px monospace'; G.fillText('PAUSED',W/2,175); G.font='15px monospace'; G.fillText('CLICK OR ESC TO RESUME',W/2,205); }
  else { let win=state==='victory'; const accuracy=P.shots?Math.round((P.kills/P.shots)*100):0; const mins=Math.floor(runTime/60), secs=Math.floor(runTime%60).toString().padStart(2,'0'); const rank=win?(P.kills>=totalEnemiesThisLevel*0.9?'S':P.kills>=totalEnemiesThisLevel*0.75?'A':P.kills>=totalEnemiesThisLevel*0.55?'B':'C'):'F';
    const totalItems = items.filter(i=>!['barrel','torch','lamp','crate','skull','banner','exit'].includes(i.k)).length;
    const itemPct = totalItems ? Math.round((P.pickups/totalItems)*100) : 0;
    G.fillStyle=win?'#61e36e':'#e63f36'; G.font='bold 36px monospace'; G.fillText(win?('LEVEL '+level+' CLEARED'):'MARINE DOWN',W/2,105);
    G.fillStyle='#ffce69'; G.font='bold 18px monospace'; G.fillText(win?'MISSION COMPLETE':'MISSION FAILED',W/2,135);
    G.fillStyle='#fff'; G.font='16px monospace'; G.fillText('KILLS '+P.kills+' ('+Math.round((P.kills/totalEnemiesThisLevel)*100)+'%)    ACCURACY '+accuracy+'%',W/2,174);
    G.fillText('ITEMS '+itemPct+'%    TIME '+mins+':'+secs+'    RANK '+rank, W/2,198);
    G.font='14px monospace'; G.fillText(win?'THE FACILITY IS QUIET. FOR NOW.':'THE DEMONS OWN THIS CORRIDOR.',W/2,228);
    G.fillStyle='#fff5c2'; G.font='bold 15px monospace'; G.fillText(win?'CLICK OR ENTER FOR NEXT LEVEL':'CLICK OR ENTER TO RUN IT BACK',W/2,270);
  }
  G.textAlign='left';
}
function doStart(){ reset(); state='play'; runStart=performance.now(); runTime=0; sfx.on(); music.start(); last=performance.now(); C.requestPointerLock(); say('CLICK TO LOCK MOUSE',1.5); }
function start(){ level=1; doStart(); }
function nextLevel(){ level++; doStart(); }
function loop(t){
  if(bits.length>180) bits.splice(0,bits.length-180); if(shots.length>45) shots.splice(0,shots.length-45); if(tracers.length>35) tracers.splice(0,tracers.length-35);
  let dt=Math.min(.05,(t-last)/1000||0); last=t;
  
  frameCount++; fpsTime += dt;
  if (fpsTime >= 0.5) { fps = Math.round(frameCount / fpsTime); frameCount = 0; fpsTime = 0; }

  if(state==='play'){
    P.update(dt); sfx.update(dt);
    if(M.down||K.ControlLeft||K.ControlRight) fire();
    if(M.rightDown||K.KeyE) altFire();
    for(const d of doors) d.open=Math.min(1,d.open+dt*.8);
    for(const e of enemies) e.update(dt);
    enemies = enemies.filter(e => !e.remove); 
    if(spawnQueue.length > 0) { enemies.push(...spawnQueue); spawnQueue = []; }
    for(const q of shots) q.update(dt); shots=shots.filter(q=>!q.dead);
    for(const b of bits){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; } bits=bits.filter(b=>b.life>0);
    for(const tr of tracers) tr.life-=dt; tracers=tracers.filter(tr=>tr.life>0);
    for(const d of dmgNums) { d.y += d.vy * dt; d.life -= dt * 1.5; } dmgNums = dmgNums.filter(d => d.life > 0);
    for(const i of items) if(!i.taken&&i.k!=='barrel'&&i.k!=='exit'&&!['torch','lamp','crate','skull','banner'].includes(i.k)&&D(i,P)<.55) pickup(i);
    
    flash=Math.max(0,flash-dt*3); mark=Math.max(0,mark-dt); shake=Math.max(0,shake-dt*3); dmgTime=Math.max(0,dmgTime-dt);
    mt-=dt; if(mt<=0) msgEl.textContent='';
  }
  G.save(); if(shake) G.translate(R(-shake*7,shake*7),R(-shake*7,shake*7)); draw.draw(dt); G.restore();
  if(state!=='play') overlay(); requestAnimationFrame(loop);
}

// Strict Pointer Lock Controls & 1-5 Weapon Switching
addEventListener('keydown',e=>{ 
  let fresh=!K[e.code]; K[e.code]=1; 
  if(['Space','ArrowLeft','ArrowRight','ControlLeft','ControlRight'].includes(e.code)) e.preventDefault(); 
  if(e.code==='Escape'){ state=state==='play'?'pause':(state==='pause'?'play':state); return; } 
  if(e.code==='KeyM'){ sfx.muted=!sfx.muted; music.setMuted(sfx.muted); say(sfx.muted?'MUSIC MUTED':'MUSIC ON',1); return; } 
  if(state==='play'&&e.code==='Space') use(); 
  if(state==='play'&&/^Digit[1-5]$/.test(e.code)){ 
    let w=+e.code.slice(-1)-1; 
    if(P.gun[w]){ P.w=w; say(['FISTS','PISTOL','SUPER SHOTGUN','PLASMA RIFLE','ROCKET LAUNCHER'][w]); } 
  } 
  if(fresh&&state==='play'&&(e.code==='ControlLeft'||e.code==='ControlRight')) fire(); 
  if(fresh&&state==='play'&&e.code==='KeyE') altFire(); 
  if((state==='title'||state==='dead')&&e.code==='Enter') start(); 
  if(state==='victory'&&e.code==='Enter') nextLevel();
});
addEventListener('keyup',e=>{K[e.code]=0;});

C.addEventListener('click',e=>{ 
  if(state==='title'||state==='dead') start(); 
  else if(state==='victory') nextLevel();
  else if(state==='pause'){ state='play'; C.requestPointerLock(); } 
  else { 
    if (!document.pointerLockElement) C.requestPointerLock(); 
    else fire(); 
  } 
});
C.addEventListener('contextmenu',e=>e.preventDefault());

addEventListener('mousedown',e=>{ 
  if(e.button===0){ M.down=1; if(state==='play'&&document.pointerLockElement) fire(); } 
  if(e.button===2){ M.rightDown=1; if(state==='play') altFire(); } 
});
addEventListener('mouseup',e=>{ if(e.button===0) M.down=0; if(e.button===2) M.rightDown=0; });

addEventListener('mousemove',e=>{ 
  if (document.pointerLockElement === C && state === 'play') { 
    P.a = wrap(P.a + e.movementX * 0.0027); 
    P.pitch = clamp(P.pitch - e.movementY * 0.5, -80, 80); 
    P.turnSway += e.movementX * 0.002; 
  } 
});

// Pointer lock change state handler
document.addEventListener('pointerlockchange', event => {
  if (state === 'play' && document.pointerLockElement !== C) {
    state = 'pause'; // Auto-pause if user unlocks mouse during gameplay
  }
});

generateTextures(); generateWallTextures(); generateRoofTexture();
reset(); requestAnimationFrame(loop);
</script></body></html>
