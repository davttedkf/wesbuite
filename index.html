let tower2Destroyed = false;

let crashCooldown = false;

let engine1Damaged = false;
let engine2Damaged = false;

let currentTower = 1;

let roundComplete = false;

let audio;
let musicStarted = false;

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.key.toLowerCase()==="p"){
        planeMenu.style.display =
            planeMenu.style.display==="block" ? "none" : "block";
    }

    if(e.key==="ArrowLeft") left=true;
    if(e.key==="ArrowRight") right=true;
    if(e.key==="ArrowUp") up=true;
    if(e.key==="ArrowDown") down=true;

    if(e.key===" "){
        braking=true;
        e.preventDefault();
    }

    startMusic();
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;

    if(e.key==="ArrowLeft") left=false;
    if(e.key==="ArrowRight") right=false;
    if(e.key==="ArrowUp") up=false;
    if(e.key==="ArrowDown") down=false;

    if(e.key===" ") braking=false;
});

function startMusic(){
    if(musicStarted) return;

    musicStarted=true;

    audio=new Audio("towersong.mp3");
    audio.loop=true;
    audio.volume=.38;

    audio.play().catch(()=>{});
}

planeButton.onclick=()=>{
    planeMenu.style.display="block";
    startMusic();
};

closeMenu.onclick=()=>{
    planeMenu.style.display="none";
};

document.querySelectorAll(".planeOption").forEach(button=>{
    button.addEventListener("click",()=>{
        selectPlane(button.dataset.plane);
    });
});

function selectPlane(type){
    selectedPlane=type;
    stats=planeData[type];

    plane.style.width=stats.width+"px";
    plane.style.height=stats.height+"px";

    velocity=Math.min(velocity,stats.maxSpeed*.65);

    document.querySelectorAll(".planeOption").forEach(b=>{
        b.classList.toggle(
            "selected",
            b.dataset.plane===type
        );
    });

    planeMenu.style.display="none";

    message.textContent=stats.name+" SELECTED";

    setTimeout(()=>{
        if(!crashed) message.textContent="";
    },1200);

    createPlaneAppearance(type);
}

function createPlaneAppearance(type){

    plane.style.filter="";

    if(type==="fighter"){
        plane.style.filter="contrast(1.25)";
    }

    if(type==="cargo"){
        plane.style.filter="brightness(.92)";
    }

    if(type==="large"){
        plane.style.filter="brightness(1.02)";
    }
}

function setMobileButton(id,downValue){
    const btn=document.getElementById(id);

    btn.addEventListener("pointerdown",e=>{
        e.preventDefault();
        startMusic();
        window[downValue]=true;
    });

    btn.addEventListener("pointerup",e=>{
        e.preventDefault();
        window[downValue]=false;
    });

    btn.addEventListener("pointercancel",()=>{
        window[downValue]=false;
    });

    btn.addEventListener("pointerleave",()=>{
        window[downValue]=false;
    });
}

setMobileButton("leftBtn","left");
setMobileButton("rightBtn","right");
setMobileButton("upBtn","up");
setMobileButton("downBtn","down");

function getPlaneRect(){
    return plane.getBoundingClientRect();
}

function getTowerRect(tower){
    return tower.getBoundingClientRect();
}

function rectsOverlap(a,b){
    return !(
        a.right < b.left ||
        a.left > b.right ||
        a.bottom < b.top ||
        a.top > b.bottom
    );
}

function checkCollision(){

    if(crashed || crashCooldown) return;

    const p=getPlaneRect();

    const t1=getTowerRect(tower1);
    const t2=getTowerRect(tower2);

    if(!hitTower1 && rectsOverlap(p,t1)){
        hitTower1=true;
        currentTower=1;

        crash(p,tower1,towerAssembly1,1);

        return;
    }

    if(hitTower1 && !hitTower2 && !tower2Destroyed && rectsOverlap(p,t2)){
        hitTower2=true;
        currentTower=2;

        crash(p,tower2,towerAssembly2,2);
    }
}

function crash(planeRect,tower,towerAssembly,number){

    crashed=true;
    crashCooldown=true;

    velocity*=.35;

    targetPitch=number===1 ? -4 : 4;

    statusText.textContent=
        "IMPACT — BUILDING DAMAGE DETECTED";

    message.textContent=
        "IMPACT";

    createImpactEffects(
        planeRect,
        tower,
        towerAssembly,
        number
    );

    damageEngine();

    plane.style.zIndex="90";

    tower.style.visibility="hidden";

    createCollapsePieces(
        towerAssembly,
        tower,
        number
    );

    setTimeout(()=>{
        startTowerCollapse(
            towerAssembly,
            number
        );
    },700);

    setTimeout(()=>{
        crashed=false;
        crashCooldown=false;

        if(number===1){
            tower1Destroyed=true;

            statusText.textContent=
                "FIRST BUILDING DESTROYED — CHOOSE YOUR NEXT PLANE";

            message.textContent=
                "CHOOSE YOUR PLANE";

            resetPlaneForSecondRun();
        }else{
            tower2Destroyed=true;

            statusText.textContent=
                "ROUND COMPLETE";

            message.textContent=
                "ROUND COMPLETE";

            roundComplete=true;

            setTimeout(()=>{
                message.textContent="FLY AGAIN";
            },1600);
        }

    },7200);
}

function damageEngine(){

    const damaged =
        Math.random()<.5 ? 1 : 2;

    const engine=
        damaged===1
            ? document.querySelector(".engine1")
            : document.querySelector(".engine2");

    if(damaged===1) engine1Damaged=true;
    else engine2Damaged=true;

    const smoke=document.createElement("div");

    smoke.className="engineSmoke";

    smoke.style.left=
        (damaged===1 ? 67 : 105)+"px";

    smoke.style.top="48px";

    plane.appendChild(smoke);

    setInterval(()=>{
        if(crashed || damaged===1 && engine1Damaged || damaged===2 && engine2Damaged){
            const s=document.createElement("div");
            s.className="engineSmoke";
            s.style.left=
                (damaged===1 ? 67 : 105)+"px";
            s.style.top="48px";
            plane.appendChild(s);

            setTimeout(()=>{
                s.remove();
            },900);
        }
    },280);
}

function createImpactEffects(
    planeRect,
    tower,
    towerAssembly,
    number
){

    const gameRect=game.getBoundingClientRect();

    const impactX=
        planeRect.left-gameRect.left+
        planeRect.width*.7;

    const impactY=
        planeRect.top-gameRect.top+
        planeRect.height*.5;

    const mark=document.createElement("div");

    mark.className="damageMark";

    mark.style.left=(impactX-30)+"px";
    mark.style.top=(impactY-40)+"px";

    game.appendChild(mark);

    createFlash(impactX,impactY);

    for(let i=0;i<12;i++){
        createGlass(impactX,impactY);
    }

    for(let i=0;i<10;i++){
        createFire(
            impactX+(Math.random()*60-30),
            impactY+(Math.random()*100-50)
        );
    }

    for(let i=0;i<9;i++){
        createSmoke(
            impactX+(Math.random()*50-25),
            impactY+(Math.random()*50-25),
            false
        );
    }

    for(let i=0;i<7;i++){
        createSmoke(
            impactX+(Math.random()*80-40),
            impactY-70-Math.random()*120,
            true
        );
    }

    for(let i=0;i<10;i++){
        createChunk(
            impactX+(Math.random()*70-35),
            impactY+(Math.random()*100-50)
        );
    }
}

function createFlash(x,y){

    const f=document.createElement("div");

    f.className="impactFlash";

    f.style.left=(x-60)+"px";
    f.style.top=(y-60)+"px";

    game.appendChild(f);

    setTimeout(()=>{
        f.remove();
    },400);
}

function createGlass(x,y){

    const g=document.createElement("div");

    g.className="glass";

    g.style.left=x+"px";
    g.style.top=y+"px";

    g.style.setProperty(
        "--gx",
        (Math.random()*240-120)+"px"
    );

    g.style.setProperty(
        "--gy",
        (Math.random()*180-70)+"px"
    );

    g.style.setProperty(
        "--gr",
        (Math.random()*720-360)+"deg"
    );

    game.appendChild(g);

    setTimeout(()=>{
        g.remove();
    },1200);
}

function createChunk(x,y){

    const c=document.createElement("div");

    c.className="buildingChunk";

    const w=20+Math.random()*35;
    const h=25+Math.random()*70;

    c.style.width=w+"px";
    c.style.height=h+"px";

    c.style.left=x+"px";
    c.style.top=y+"px";

    c.style.setProperty(
        "--cx",
        (Math.random()*260-130)+"px"
    );

    c.style.setProperty(
        "--cy",
        (130+Math.random()*360)+"px"
    );

    c.style.setProperty(
        "--cr",
        (Math.random()*100-50)+"deg"
    );

    c.style.setProperty(
        "--ct",
        (1.2+Math.random()*2)+"s"
    );

    game.appendChild(c);

    setTimeout(()=>{
        c.remove();
    },4000);
}

function createFire(x,y){

    const fire=document.createElement("div");

    fire.className="fire";

    fire.style.left=x+"px";
    fire.style.top=y+"px";

    game.appendChild(fire);

    setTimeout(()=>{
        fire.remove();
    },5000);
}

function createSmoke(x,y,light){

    const smoke=document.createElement(
        "div"
    );

    smoke.className=
        light ? "lightSmoke" : "smoke";

    smoke.style.left=x+"px";
    smoke.style.top=y+"px";

    smoke.style.setProperty(
        "--sx",
        (Math.random()*100-50)+"px"
    );

    game.appendChild(smoke);

    setTimeout(()=>{
        smoke.remove();
    },6500);
}

function createCollapsePieces(
    assembly,
    originalTower,
    number
){

    const old=assembly.querySelector(
        ".collapsePieces"
    );

    if(old) old.remove();

    const pieces=document.createElement("div");

    pieces.className="collapsePieces";

    assembly.appendChild(pieces);

    const width=assembly.clientWidth;
    const height=assembly.clientHeight;

    const sectionHeight=height/4;

    for(let i=0;i<4;i++){

        const section=document.createElement(
            "div"
        );

        section.className="collapseSection";

        section.style.left="0";
        section.style.top=
            (i*sectionHeight)+"px";

        section.style.width=width+"px";
        section.style.height=
            (sectionHeight+3)+"px";

        section.style.clipPath=
            `inset(0 0 0 0)`;

        section.style.setProperty(
            "--sx",
            (
                (i-1.5)*(
                    number===1 ? 90 : 110
                )
            )+"px"
        );

        section.style.setProperty(
            "--sy",
            (
                130+
                i*90+
                Math.random()*100
            )+"px"
        );

        section.style.setProperty(
            "--sr",
            (
                (Math.random()-.5)*(
                    number===1 ? 28 : 35
                )
            )+"deg"
        );

        section.style.setProperty(
            "--st",
            (2.2+Math.random()*1.3)+"s"
        );

        pieces.appendChild(section);
    }

    createFallingWindows(
        assembly,
        width,
        height
    );

    setTimeout(()=>{
        originalTower.style.visibility="hidden";
    },50);
}

function createFallingWindows(
    assembly,
    width,
    height
){

    const count=Math.floor(
        width/18
    )*Math.floor(
        height/65
    );

    for(let i=0;i<count;i++){

        const w=document.createElement(
            "div"
        );

        w.className="fallingWindow";

        const x=
            14+
            Math.random()*
            Math.max(10,width-28);

        const y=
            25+
            Math.random()*
            Math.max(10,height-50);

        w.style.left=x+"px";
        w.style.top=y+"px";

        w.style.setProperty(
            "--wx",
            (Math.random()*260-130)+"px"
        );

        w.style.setProperty(
            "--wy",
            (170+Math.random()*430)+"px"
        );

        w.style.setProperty(
            "--wr",
            (Math.random()*720-360)+"deg"
        );

        w.style.setProperty(
            "--wt",
            (1.5+Math.random()*3)+"s"
        );

        assembly.appendChild(w);

        setTimeout(()=>{
            w.remove();
        },5000);
    }
}

function startTowerCollapse(
    assembly,
    number
){

    assembly.style.zIndex="15";

    const sections=
        assembly.querySelectorAll(
            ".collapseSection"
        );

    sections.forEach((section,i)=>{

        section.style.animationPlayState=
            "running";

        if(i===2 || i===3){
            createDustAtBottom(
                assembly,
                i
            );
        }
    });

    setTimeout(()=>{
        createDustAtBottom(
            assembly,
            0
        );
    },1800);
}

function createDustAtBottom(
    assembly,
    index
){

    const rect=
        assembly.getBoundingClientRect();

    const gameRect=
        game.getBoundingClientRect();

    const dust=document.createElement(
        "div"
    );

    dust.className="dust";

    dust.style.left=
        (
            rect.left-gameRect.left+
            rect.width*(.2+.2*index)
        )+"px";

    dust.style.top=
        (
            rect.bottom-gameRect.top-40
        )+"px";

    game.appendChild(dust);

    setTimeout(()=>{
        dust.remove();
    },2500);
}

function resetPlaneForSecondRun(){

    setTimeout(()=>{

        px=3.5;
        py=35;

        velocity=0;
        verticalVelocity=0;

        pitch=0;
        targetPitch=0;

        plane.style.left=px+"%";
        plane.style.top=py+"%";
        plane.style.transform=
            "rotate(0deg)";

        message.textContent=
            "CHOOSE YOUR PLANE";

        crashed=false;
        crashCooldown=false;

    },900);
}

function resetGame(){

    hitTower1=false;
    hitTower2=false;

    tower1Destroyed=false;
    tower2Destroyed=false;

    roundComplete=false;

    towerAssembly1.style.transform="";
    towerAssembly2.style.transform="";

    tower1.style.visibility="visible";
    tower2.style.visibility="visible";

    towerAssembly1.querySelector(
        ".collapsePieces"
    )?.remove();

    towerAssembly2.querySelector(
        ".collapsePieces"
    )?.remove();

    document.querySelectorAll(
        ".fallingWindow,.buildingChunk,.glass,.fire,.smoke,.lightSmoke,.dust,.damageMark,.impactFlash"
    ).forEach(e=>e.remove());

    px=3.5;
    py=35;

    velocity=0;
    verticalVelocity=0;

    pitch=0;
    targetPitch=0;

    crashed=false;
    crashCooldown=false;

    plane.style.left=px+"%";
    plane.style.top=py+"%";
    plane.style.transform="rotate(0deg)";

    statusText.textContent=
        "FLY TOWARD THE BUILDINGS";

    message.textContent="";

    currentTower=1;
}

function physics(){

    if(roundComplete){

        if(keys["r"]){
            resetGame();
        }

        return;
    }

    if(crashed) return;

    const acceleration=
        stats.acceleration;

    if(up){
        verticalVelocity-=.055;
        targetPitch=-12;
    }else if(down){
        verticalVelocity+=.055;
        targetPitch=12;
    }else{
        targetPitch*=.94;
        verticalVelocity*=.96;
    }

    if(left){
        px-=stats.turn;
        targetPitch-=7;
    }

    if(right){
        px+=stats.turn;
        targetPitch+=7;
    }

    if(braking){
        velocity-=stats.braking;
    }else{
        velocity+=acceleration;
    }

    velocity=Math.max(
        0,
        Math.min(
            velocity,
            stats.maxSpeed
        )
    );

    verticalVelocity=
        Math.max(
            -3,
            Math.min(
                verticalVelocity,
                3
            )
        );

    py+=verticalVelocity*.12;

    /*
        STALL PHYSICS
        If the aircraft is too slow while
        pitched upward, it begins losing altitude.
    */

    if(
        targetPitch < -5 &&
        velocity < stats.maxSpeed*stats.stall
    ){

        verticalVelocity+=.025;

        statusText.textContent=
            "STALL — LOWER THE NOSE";

    }else if(!hitTower1){

        statusText.textContent=
            "FLY TOWARD THE BUILDINGS";
    }

    /*
        Natural forward motion.
    */

    px+=velocity*.055;

    /*
        Keep aircraft in playable sky.
    */

    if(py<5){
        py=5;
        verticalVelocity=Math.max(
            verticalVelocity,
            0
        );
    }

    if(py>72){
        py=72;
        verticalVelocity=Math.min(
            verticalVelocity,
            0
        );
    }

    if(px>105){
        px=-18;
    }

    if(px<-25){
        px=105;
    }

    pitch+=(targetPitch-pitch)*.09;

    plane.style.left=px+"%";
    plane.style.top=py+"%";

    plane.style.transform=
        `rotate(${pitch}deg)`;
}

let last=performance.now();

function loop(now){

    const dt=
        Math.min(
            50,
            now-last
        );

    last=now;

    physics();
    checkCollision();

    requestAnimationFrame(loop);
}

selectPlane("airliner");

requestAnimationFrame(loop);

/*
    Start a little movement automatically so
    the aircraft does not sit completely still.
*/
velocity=.8;

</script>

</body>
</html>
