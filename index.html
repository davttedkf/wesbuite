
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hee</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: white;
            color: black;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My Website</h1>

        <button onclick="playSound()">
            Play Sound
        </button>
    </div>

    <audio id="clickSound" src="sounds/.mp3"></audio>

    <script>
        function playSound() {
            const sound = document.getElementById("clickSound");

            sound.currentTime = 0;
            sound.play();
        }
    </script>

</body>
</html>
