
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Pixel Sky Crash</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101827;
    color:white;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.screen.active{
    display:flex;
}

.menu{
    width:min(92vw,520px);
    padding:30px;
    border:4px solid #fff;
    background:#182238;
    box-shadow:10px 10px 0 #080d18;
    text-align:center;
}

.title{
    margin:0 0 8px;
    font-size:clamp(34px,8vw,64px);
    line-height:1;
    letter-spacing:2px;
    text-shadow:5px 5px 0 #080d18;
}

.subtitle{
    margin:0 0 25px;
    color:#b9c6df;
}

input{
    width:100%;
    padding:15px;
    border:3px solid white;
    background:#0e1627;
    color:white;
    outline:none;
    text-align:center;
    margin-bottom:14px;
}

.mainBtn{
    width:100%;
    padding:15px;
    border:3px solid white;
    background:#3e79ff;
    color:white;
    font-weight:bold;
    margin-top:8px;
}

.mainBtn:hover{
    background:#5a8cff;
}

.smallBtn{
    padding:10px 18px;
    border:3px solid white;
    background:#263451;
    color:white;
    font-weight:bold;
}

#game{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            #69c9ff 0%,
            #9ee4ff 55%,
            #d9f7ff 100%
        );
}

#game.active{
    display:block;
}

#world{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.sun{
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#fff4a5;
    right:9%;
    top:8%;
    box-shadow:0 0 45px rgba(255,244,165,.7);
}

.cloud{
    position:absolute;
    width:170px;
    height:45px;
    background:rgba(255,255,255,.75);
    border-radius:40px;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud:before{
    width:65px;
    height:65px;
    left:25px;
    top:-30px;
}

.cloud:after{
    width:80px;
    height:80px;
    right:20px;
    top:-40px;
}

.c1{
    top:15%;
    left:7%;
}

.c2{
    top:32%;
    right:4%;
    transform:scale(.75);
}

.c3{
    top:8%;
    left:40%;
    transform:scale(.55);
}

.city{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:32%;
    background:
        repeating-linear-gradient(
            90deg,
            #4d6579 0 45px,
            #3e566b 45px 85px
        );
    opacity:.8;
}

.city:before{
    content:"";
    position:absolute;
    inset:20px 0 0;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 18px,
            rgba(255,241,151,.65) 18px 24px,
            transparent 24px 42px
        );
    opacity:.6;
}

.tower{
    position:absolute;
    width:17.5%;
    min-width:120px;
    max-width:190px;
    height:55%;
    bottom:0;
    background:
        repeating-linear-gradient(
            90deg,
            #38495d 0 15px,
            #263649 15px 30px
        );
    border:4px solid #182638;
    box-shadow:8px 0 0 rgba(0,0,0,.18);
}

.tower:before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:0;
    height:8px;
    background:#8194a7;
}

.towerLeft{
    left:26%;
}

.towerRight{
    left:56.5%;
}

.tower.destroyed{
    transform:rotate(-5deg) translateY(30px);
    opacity:.35;
}

.towerRoof{
    position:absolute;
    left:-4px;
    right:-4px;
    top:-9px;
    height:10px;
    background:#172638;
}

.healthBox{
    position:absolute;
    top:-42px;
    left:0;
    width:100%;
    height:27px;
    border:3px solid white;
    background:#101827;
}

.healthFill{
    height:100%;
    width:100%;
    background:#55df72;
}

.healthText{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
}

.turret{
    position:absolute;
    width:55px;
    height:32px;
    z-index:30;
    transform-origin:bottom center;
}

.turretBase{
    position:absolute;
    width:40px;
    height:20px;
    left:8px;
    bottom:0;
    background:#161d28;
    border:3px solid #05080d;
}

.turretGun{
    position:absolute;
    width:48px;
    height:8px;
    left:10px;
    bottom:18px;
    background:#111722;
    border:2px solid #05080d;
    transform-origin:5px center;
}

.turretGun:after{
    content:"";
    position:absolute;
    right:-10px;
    top:1px;
    width:12px;
    height:4px;
    background:#05080d;
}

#plane{
    position:absolute;
    width:82px;
    height:34px;
    z-index:40;
    transform-origin:center center;
}

.planeBody{
    position:absolute;
    left:8px;
    top:10px;
    width:62px;
    height:14px;
    background:#f1f1f1;
    border:3px solid #182238;
}

.planeNose{
    position:absolute;
    right:-7px;
    top:11px;
    width:20px;
    height:12px;
    background:#f1f1f1;
    border-right:3px solid #182238;
    transform:skewX(30deg);
}

.planeWing{
    position:absolute;
    left:25px;
    top:2px;
    width:35px;
    height:32px;
    background:#d7dce2;
    clip-path:polygon(0 45%,100% 0,75% 100%);
    border:2px solid #182238;
}

.planeTail{
    position:absolute;
    left:8px;
    top:1px;
    width:20px;
    height:18px;
    background:#d7dce2;
    clip-path:polygon(0 100%,100% 100%,55% 0);
}

.planeWindow{
    position:absolute;
    left:48px;
    top:12px;
    width:13px;
    height:7px;
    background:#65b8e8;
    border:2px solid #182238;
}

.fire{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#ff9d21;
    box-shadow:
        0 0 20px #ff641f,
        0 0 40px #ff3015;
    z-index:45;
    animation:fire .16s infinite alternate;
}

.fire:after{
    content:"";
    position:absolute;
    width:25px;
    height:40px;
    background:#fff2a6;
    border-radius:50%;
    left:20px;
    top:5px;
}

@keyframes fire{
    from{transform:scale(.9)}
    to{transform:scale(1.12)}
}

.smoke{
    position:absolute;
    width:25px;
    height:25px;
    border-radius:50%;
    background:#5c6269;
    opacity:.65;
    animation:smoke 1.5s linear forwards;
    z-index:44;
}

@keyframes smoke{
    from{
        transform:translate(0,0) scale(.5);
        opacity:.7;
    }
    to{
        transform:translate(-20px,-90px) scale(2.5);
        opacity:0;
    }
}

.debris{
    position:absolute;
    width:10px;
    height:10px;
    background:#303a45;
    z-index:50;
    animation:debris 1.1s ease-out forwards;
}

@keyframes debris{
    to{
        transform:translate(var(--dx),var(--dy)) rotate(500deg);
        opacity:0;
    }
}

#hud{
    position:absolute;
    left:15px;
    right:15px;
    top:15px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    z-index:80;
    pointer-events:none;
}

.hudPanel{
    padding:10px 14px;
    background:rgba(10,16,27,.82);
    border:3px solid white;
    box-shadow:4px 4px 0 rgba(0,0,0,.25);
}

.hudName{
    font-size:12px;
    color:#b8c5d8;
}

.hudValue{
    font-weight:bold;
    font-size:18px;
}

#planeHealth{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    width:min(330px,60vw);
    height:22px;
    border:3px solid white;
    background:#101827;
    z-index:80;
}

#planeHealthFill{
    height:100%;
    width:100%;
    background:#ef5350;
}

#planeHealthText{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
}

#roleBox{
    position:absolute;
    left:50%;
    top:115px;
    transform:translateX(-50%);
    padding:8px 14px;
    background:rgba(10,16,27,.78);
    border:2px solid white;
    z-index:80;
    font-weight:bold;
}

#crosshair{
    position:absolute;
    width:34px;
    height:34px;
    margin-left:-17px;
    margin-top:-17px;
    border:3px solid #ff4141;
    border-radius:50%;
    z-index:70;
    pointer-events:none;
    display:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#ff4141;
}

#crosshair:before{
    width:46px;
    height:2px;
    left:-9px;
    top:13px;
}

#crosshair:after{
    width:2px;
    height:46px;
    left:13px;
    top:-9px;
}

#fireButton{
    position:absolute;
    right:25px;
    bottom:30px;
    width:100px;
    height:100px;
    border-radius:50%;
    border:5px solid white;
    background:#d93030;
    color:white;
    font-size:18px;
    font-weight:bold;
    z-index:100;
    display:none;
}

#mobileControls{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:90;
}

.controlBtn{
    position:absolute;
    width:60px;
    height:60px;
    border:3px solid white;
    background:rgba(15,24,40,.75);
    color:white;
    pointer-events:auto;
    font-size:22px;
    font-weight:bold;
}

#upBtn{
    left:80px;
    bottom:135px;
}

#downBtn{
    left:80px;
    bottom:15px;
}

#leftBtn{
    left:15px;
    bottom:75px;
}

#rightBtn{
    left:145px;
    bottom:75px;
}

#brakeBtn{
    left:15px;
    bottom:15px;
    width:60px;
    height:45px;
    font-size:13px;
}

#planeSelector{
    display:none;
    margin-top:20px;
}

.planeOption{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    padding:12px;
    margin:7px 0;
    background:#111b2d;
    color:white;
    border:2px solid #60708d;
}

.planeOption.selected{
    border-color:#58a6ff;
    background:#1b3155;
}

#countdown{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:150;
    font-size:clamp(60px,15vw,140px);
    font-weight:bold;
    text-shadow:8px 8px 0 #101827;
    background:rgba(0,0,0,.2);
}

@media(max-width:700px){
    .menu{
        padding:22px;
    }

    .tower{
        width:20%;
    }

    .towerLeft{
        left:20%;
    }

    .towerRight{
        left:60%;
    }

    #hud{
        font-size:12px;
    }

    .hudPanel{
        padding:7px 9px;
    }
}
</style>
</head>

<body>

<div id="menuScreen" class="screen active">
    <div class="menu">
        <h1 class="title">PIXEL SKY CRASH</h1>
        <p class="subtitle">1V1 PILOT VS GUNNER</p>

        <input
            id="nameInput"
            maxlength="16"
            placeholder="Enter your name"
            autocomplete="off"
        >

        <button
            id="findMatchBtn"
            class="mainBtn"
        >
            FIND 1V1 MATCH
        </button>

        <button
            id="planeMenuBtn"
            class="mainBtn"
        >
            PLANE SELECT
        </button>

        <div id="planeSelector">
            <button class="planeOption selected" data-plane="airliner">
                <span>Airliner</span>
                <span>Balanced</span>
            </button>

            <button class="planeOption" data-plane="small">
                <span>Small Jet</span>
                <span>Fast</span>
            </button>

            <button class="planeOption" data-plane="large">
                <span>Large Airliner</span>
                <span>Heavy</span>
            </button>

            <button class="planeOption" data-plane="cargo">
                <span>Cargo Plane</span>
                <span>Heavy</span>
            </button>

            <button class="planeOption" data-plane="fighter">
                <span>Fighter Jet</span>
                <span>Very Fast</span>
            </button>
        </div>
    </div>
</div>

<div id="queueScreen" class="screen">
    <div class="menu">
        <h1 class="title">MATCHMAKING</h1>
        <p id="queueText" class="subtitle">
            Looking for another player...
        </p>

        <button id="cancelQueueBtn" class="smallBtn">
            CANCEL
        </button>
    </div>
</div>

<div id="foundScreen" class="screen">
    <div class="menu">
        <h1 class="title">MATCH FOUND</h1>
        <p id="matchPlayers" class="subtitle"></p>
        <div id="foundCountdown" style="font-size:60px;font-weight:bold">
            3
        </div>
    </div>
</div>

<div id="game">

    <div id="world">

        <div class="sun"></div>

        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>

        <div class="city"></div>

        <div
            id="tower1"
            class="tower towerLeft"
        >
            <div class="towerRoof"></div>

            <div class="healthBox">
                <div
                    id="tower1Fill"
                    class="healthFill"
                ></div>

                <div
                    id="tower1Text"
                    class="healthText"
                >
                    100%
                </div>
            </div>
        </div>

        <div
            id="tower2"
            class="tower towerRight"
        >
            <div class="towerRoof"></div>

            <div class="healthBox">
                <div
                    id="tower2Fill"
                    class="healthFill"
                ></div>

                <div
                    id="tower2Text"
                    class="healthText"
                >
                    100%
                </div>
            </div>
        </div>

        <div id="turret" class="turret">
            <div class="turretBase"></div>
            <div id="turretGun" class="turretGun"></div>
        </div>

        <div id="plane">
            <div class="planeTail"></div>
            <div class="planeWing"></div>
            <div class="planeBody"></div>
            <div class="planeNose"></div>
            <div class="planeWindow"></div>
        </div>

        <div id="crosshair"></div>

    </div>

    <div id="hud">

        <div class="hudPanel">
            <div class="hudName">YOU</div>
            <div id="youName" class="hudValue">Player</div>
        </div>

        <div class="hudPanel">
            <div class="hudName">OPPONENT</div>
            <div id="opponentName" class="hudValue">Player</div>
        </div>

    </div>

    <div id="roleBox">
        WAITING
    </div>

    <div id="planeHealth">
        <div id="planeHealthFill"></div>
        <div id="planeHealthText">PLANE 100%</div>
    </div>

    <button id="fireButton">
        FIRE
    </button>

    <div id="mobileControls">

        <button id="upBtn" class="controlBtn">
            ▲
        </button>

        <button id="downBtn" class="controlBtn">
            ▼
        </button>

        <button id="leftBtn" class="controlBtn">
            ◀
        </button>

        <button id="rightBtn" class="controlBtn">
            ▶
        </button>

        <button id="brakeBtn" class="controlBtn">
            BRAKE
        </button>

    </div>

    <div id="countdown"></div>
</div>

<div id="endScreen" class="screen">
    <div class="menu">
        <h1 id="endTitle" class="title">
            GAME OVER
        </h1>

        <p id="endReason" class="subtitle"></p>

        <button
            id="rematchBtn"
            class="mainBtn"
        >
            REMATCH
        </button>

        <button
            id="menuBtn"
            class="mainBtn"
        >
            MAIN MENU
        </button>
    </div>
</div>

<script>
const menuScreen =
    document.getElementById("menuScreen");

const queueScreen =
    document.getElementById("queueScreen");

const foundScreen =
    document.getElementById("foundScreen");

const endScreen =
    document.getElementById("endScreen");

const game =
    document.getElementById("game");

const nameInput =
    document.getElementById("nameInput");

const findMatchBtn =
    document.getElementById("findMatchBtn");

const cancelQueueBtn =
    document.getElementById("cancelQueueBtn");

const rematchBtn =
    document.getElementById("rematchBtn");

const menuBtn =
    document.getElementById("menuBtn");

const planeMenuBtn =
    document.getElementById("planeMenuBtn");

const planeSelector =
    document.getElementById("planeSelector");

const plane =
    document.getElementById("plane");

const turret =
    document.getElementById("turret");

const turretGun =
    document.getElementById("turretGun");

const tower1 =
    document.getElementById("tower1");

const tower2 =
    document.getElementById("tower2");

const tower1Fill =
    document.getElementById("tower1Fill");

const tower2Fill =
    document.getElementById("tower2Fill");

const tower1Text =
    document.getElementById("tower1Text");

const tower2Text =
    document.getElementById("tower2Text");

const planeHealthFill =
    document.getElementById("planeHealthFill");

const planeHealthText =
    document.getElementById("planeHealthText");

const crosshair =
    document.getElementById("crosshair");

const fireButton =
    document.getElementById("fireButton");

const roleBox =
    document.getElementById("roleBox");

const youName =
    document.getElementById("youName");

const opponentName =
    document.getElementById("opponentName");

const countdown =
    document.getElementById("countdown");

const foundCountdown =
    document.getElementById("foundCountdown");

const matchPlayers =
    document.getElementById("matchPlayers");

const endTitle =
    document.getElementById("endTitle");

const endReason =
    document.getElementById("endReason");

let socket = null;

let myRole = null;
let myName = "Player";
let opponentNameValue = "Player";

let currentState = null;

let selectedPlane = "airliner";

let lastState = null;

const input = {
    up:false,
    down:false,
    left:false,
    right:false,
    brake:false
};

const planeData = {
    small:{
        name:"Small Jet"
    },

    airliner:{
        name:"Airliner"
    },

    large:{
        name:"Large Airliner"
    },

    cargo:{
        name:"Cargo Plane"
    },

    fighter:{
        name:"Fighter Jet"
    }
};

function showOnly(screen){
    menuScreen.classList.remove("active");
    queueScreen.classList.remove("active");
    foundScreen.classList.remove("active");
    endScreen.classList.remove("active");

    if(screen){
        screen.classList.add("active");
    }
}

function connect(){
    if(socket &&
       (
           socket.readyState === WebSocket.OPEN ||
           socket.readyState === WebSocket.CONNECTING
       )
    ){
        return;
    }

    let serverURL;

    if(location.protocol === "file:"){
        serverURL =
            "ws://localhost:3000";
    }
    else if(location.protocol === "https:"){
        serverURL =
            "wss://" + location.host;
    }
    else{
        serverURL =
            "ws://" + location.host;
    }

    socket =
        new WebSocket(serverURL);

    socket.addEventListener(
        "open",
        () => {
            console.log(
                "Connected to game server."
            );
        }
    );

    socket.addEventListener(
        "close",
        () => {
            console.log(
                "Disconnected from server."
            );

            if(
                !game.classList.contains("active")
            ){
                return;
            }

            roleBox.textContent =
                "DISCONNECTED";
        }
    );

    socket.addEventListener(
        "error",
        () => {
            console.log(
                "WebSocket connection error."
            );
        }
    );

    socket.addEventListener(
        "message",
        event => {
            let message;

            try{
                message =
                    JSON.parse(event.data);
            }
            catch{
                return;
            }

            handleServerMessage(message);
        }
    );
}

function send(data){
    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){
        return;
    }

    socket.send(
        JSON.stringify(data)
    );
}

function handleServerMessage(message){

    if(message.type === "connected"){
        return;
    }

    if(message.type === "queued"){
        queueScreen
            .querySelector(".subtitle")
            .textContent =
            "Looking for another player...";
        return;
    }

    if(message.type === "matchFound"){
        myRole =
            message.you.role;

        myName =
            message.you.name;

        opponentNameValue =
            message.opponent.name;

        youName.textContent =
            myName;

        opponentName.textContent =
            opponentNameValue;

        roleBox.textContent =
            myRole.toUpperCase();

        matchPlayers.textContent =
            `${myName} (${myRole}) VS ${opponentNameValue} (${message.opponent.role})`;

        showOnly(foundScreen);

        let count = 3;

        foundCountdown.textContent =
            count;

        const interval =
            setInterval(() => {
                count--;

                if(count > 0){
                    foundCountdown.textContent =
                        count;
                }
                else{
                    clearInterval(interval);

                    foundCountdown.textContent =
                        "GO!";

                    setTimeout(() => {
                        showGame();
                    },500);
                }
            },1000);

        return;
    }

    if(message.type === "state"){
        currentState =
            message.state;

        renderState(
            currentState
        );

        if(
            currentState.phase ===
            "ended"
        ){
            showEnd(
                currentState
            );
        }

        return;
    }

    if(message.type === "opponentLeft"){
        showEnd({
            winnerName:myName,
            reason:"Your opponent left the match."
        });

        return;
    }
}

function showGame(){
    showOnly(null);

    game.classList.add("active");

    crosshair.style.display =
        myRole === "Gunner"
            ? "block"
            : "none";

    fireButton.style.display =
        myRole === "Gunner"
            ? "block"
            : "none";

    document.getElementById(
        "mobileControls"
    ).style.display =
        myRole === "Pilot"
            ? "block"
            : "none";
}

function renderState(state){

    if(!state){
        return;
    }

    currentState =
        state;

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    /*
        The server uses a normalized
        1000 x 600 world.

        Convert it to the player's
        actual screen size.
    */

    const sx =
        width / 1000;

    const sy =
        height / 600;

    const p =
        state.plane;

    const px =
        p.x * sx;

    const py =
        p.y * sy;

    plane.style.left =
        `${px - 41}px`;

    plane.style.top =
        `${py - 17}px`;

    plane.style.transform =
        `rotate(${p.pitch}deg)`;

    const leftTower =
        tower1;

    const rightTower =
        tower2;

    const tower1HP =
        Math.max(
            0,
            state.towers[0].hp
        );

    const tower2HP =
        Math.max(
            0,
            state.towers[1].hp
        );

    tower1Fill.style.width =
        `${tower1HP}%`;

    tower2Fill.style.width =
        `${tower2HP}%`;

    tower1Text.textContent =
        `${tower1HP}%`;

    tower2Text.textContent =
        `${tower2HP}%`;

    if(
        state.towers[0].destroyed
    ){
        leftTower.classList.add(
            "destroyed"
        );
    }
    else{
        leftTower.classList.remove(
            "destroyed"
        );
    }

    if(
        state.towers[1].destroyed
    ){
        rightTower.classList.add(
            "destroyed"
        );
    }
    else{
        rightTower.classList.remove(
            "destroyed"
        );
    }

    const planeHP =
        Math.max(
            0,
            state.plane.hp
        );

    planeHealthFill.style.width =
        `${planeHP}%`;

    planeHealthText.textContent =
        `PLANE ${planeHP}%`;

    roleBox.textContent =
        myRole === "Gunner"
            ? `GUNNER — TOWER ${state.gunnerTower}`
            : `PILOT — ${planeData[state.plane.planeType]?.name || "Plane"}`;

    /*
        Turret positions use the same
        normalized server world.
    */

    let tx;

    if(state.gunnerTower === 1){
        tx = 347;
    }
    else{
        tx = 652;
    }

    const ty = 245;

    turret.style.left =
        `${tx * sx - 27}px`;

    turret.style.top =
        `${ty * sy - 32}px`;

    /*
        Aim the turret.
    */

    if(myRole === "Gunner"){
        const ax =
            state.aim.x * sx;

        const ay =
            state.aim.y * sy;

        const turretCenterX =
            tx * sx;

        const turretCenterY =
            ty * sy;

        const angle =
            Math.atan2(
                ay - turretCenterY,
                ax - turretCenterX
            ) * 180 / Math.PI;

        turretGun.style.transform =
            `rotate(${angle}deg)`;
    }

    /*
        Create local effects whenever
        a tower loses HP.
    */

    if(lastState){
        if(
            state.towers[0].hp <
            lastState.towers[0].hp
        ){
            createImpact(
                347 * sx,
                300 * sy
            );
        }

        if(
            state.towers[1].hp <
            lastState.towers[1].hp
        ){
            createImpact(
                652 * sx,
                300 * sy
            );
        }

        if(
            state.plane.hp <
            lastState.plane.hp
        ){
            createPlaneHit(
                px,
                py
            );
        }

        if(
            state.towers[0].destroyed &&
            !lastState.towers[0].destroyed
        ){
            collapseTower(
                tower1
            );
        }

        if(
            state.towers[1].destroyed &&
            !lastState.towers[1].destroyed
        ){
            collapseTower(
                tower2
            );
        }
    }

    lastState =
        JSON.parse(
            JSON.stringify(state)
        );
}

function createImpact(x,y){

    const flash =
        document.createElement("div");

    flash.style.position =
        "absolute";

    flash.style.left =
        `${x - 25}px`;

    flash.style.top =
        `${y - 25}px`;

    flash.style.width =
        "50px";

    flash.style.height =
        "50px";

    flash.style.borderRadius =
        "50%";

    flash.style.background =
        "#fff";

    flash.style.zIndex =
        "90";

    flash.style.pointerEvents =
        "none";

    world.appendChild(
        flash
    );

    setTimeout(() => {
        flash.remove();
    },100);
}

function createPlaneHit(x,y){

    for(let i=0;i<5;i++){

        const smoke =
            document.createElement("div");

        smoke.className =
            "smoke";

        smoke.style.left =
            `${x + (Math.random()*30-15)}px`;

        smoke.style.top =
            `${y + (Math.random()*20-10)}px`;

        world.appendChild(
            smoke
        );

        setTimeout(() => {
            smoke.remove();
        },1500);
    }
}

function collapseTower(element){

    const rect =
        element.getBoundingClientRect();

    const worldRect =
        world.getBoundingClientRect();

    const x =
        rect.left -
        worldRect.left +
        rect.width / 2;

    const y =
        rect.top -
        worldRect.top +
        20;

    const fire =
        document.createElement("div");

    fire.className =
        "fire";

    fire.style.left =
        `${x - 32}px`;

    fire.style.top =
        `${y - 32}px`;

    world.appendChild(
        fire
    );

    setTimeout(() => {
        fire.remove();
    },3000);

    for(let i=0;i<22;i++){

        const debris =
            document.createElement("div");

        debris.className =
            "debris";

        debris.style.left =
            `${x + Math.random()*100-50}px`;

        debris.style.top =
            `${y + Math.random()*50}px`;

        debris.style.setProperty(
            "--dx",
            `${Math.random()*300-150}px`
        );

        debris.style.setProperty(
            "--dy",
            `${Math.random()*250+50}px`
        );

        world.appendChild(
            debris
        );

        setTimeout(() => {
            debris.remove();
        },1200);
    }
}

function showEnd(state){

    game.classList.remove(
        "active"
    );

    showOnly(endScreen);

    const won =
        state.winnerName === myName;

    endTitle.textContent =
        won
            ? "YOU WIN!"
            : "YOU LOSE!";

    endReason.textContent =
        state.reason ||
        "The match has ended.";
}

findMatchBtn.addEventListener(
    "click",
    () => {

        const entered =
            nameInput.value.trim();

        myName =
            entered || "Player";

        nameInput.value =
            myName;

        connect();

        const wait =
            setInterval(() => {

                if(
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ){
                    clearInterval(wait);

                    send({
                        type:"queue",
                        name:myName
                    });

                    showOnly(
                        queueScreen
                    );
                }

            },100);

        setTimeout(
            () => clearInterval(wait),
            5000
        );
    }
);

cancelQueueBtn.addEventListener(
    "click",
    () => {

        send({
            type:"cancelQueue"
        });

        showOnly(
            menuScreen
        );
    }
);

planeMenuBtn.addEventListener(
    "click",
    () => {

        planeSelector.style.display =
            planeSelector.style.display ===
            "block"
                ? "none"
                : "block";
    }
);

document.querySelectorAll(
    ".planeOption"
).forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document.querySelectorAll(
                ".planeOption"
            ).forEach(
                b =>
                    b.classList.remove(
                        "selected"
                    )
            );

            button.classList.add(
                "selected"
            );

            selectedPlane =
                button.dataset.plane;

            if(
                myRole === "Pilot"
            ){
                send({
                    type:"selectPlane",
                    plane:selectedPlane
                });
            }
        }
    );
});

rematchBtn.addEventListener(
    "click",
    () => {

        lastState = null;

        game.classList.remove(
            "active"
        );

        connect();

        const wait =
            setInterval(() => {

                if(
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ){
                    clearInterval(wait);

                    send({
                        type:"queue",
                        name:myName
                    });

                    showOnly(
                        queueScreen
                    );
                }

            },100);
    }
);

menuBtn.addEventListener(
    "click",
    () => {

        send({
            type:"leaveRoom"
        });

        game.classList.remove(
            "active"
        );

        showOnly(
            menuScreen
        );
    }
);

/*
    Keyboard controls.
*/

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if(key === "w" || key === "arrowup"){
            input.up = true;
        }

        if(key === "s" || key === "arrowdown"){
            input.down = true;
        }

        if(key === "a" || key === "arrowleft"){
            input.left = true;
        }

        if(key === "d" || key === "arrowright"){
            input.right = true;
        }

        if(key === " "){
            input.brake = true;
            event.preventDefault();
        }

        if(
            key === "p" &&
            myRole === "Pilot"
        ){

            const names =
                Object.keys(
                    planeData
                );

            let index =
                names.indexOf(
                    selectedPlane
                );

            index =
                (index + 1) %
                names.length;

            selectedPlane =
                names[index];

            send({
                type:"selectPlane",
                plane:selectedPlane
            });
        }

        sendInput();
    }
);

document.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();

        if(key === "w" || key === "arrowup"){
            input.up = false;
        }

        if(key === "s" || key === "arrowdown"){
            input.down = false;
        }

        if(key === "a" || key === "arrowleft"){
            input.left = false;
        }

        if(key === "d" || key === "arrowright"){
            input.right = false;
        }

        if(key === " "){
            input.brake = false;
        }

        sendInput();
    }
);

function sendInput(){

    if(myRole !== "Pilot"){
        return;
    }

    send({
        type:"input",
        input:{
            up:input.up,
            down:input.down,
            left:input.left,
            right:input.right,
            brake:input.brake
        }
    });
}

/*
    Mobile pilot buttons.
*/

function bindHold(
    element,
    property
){

    element.addEventListener(
        "pointerdown",
        event => {
            event.preventDefault();

            input[property] = true;
            sendInput();
        }
    );

    element.addEventListener(
        "pointerup",
        event => {
            event.preventDefault();

            input[property] = false;
            sendInput();
        }
    );

    element.addEventListener(
        "pointercancel",
        () => {
            input[property] = false;
            sendInput();
        }
    );

    element.addEventListener(
        "pointerleave",
        () => {
            input[property] = false;
            sendInput();
        }
    );
}

bindHold(
    document.getElementById("upBtn"),
    "up"
);

bindHold(
    document.getElementById("downBtn"),
    "down"
);

bindHold(
    document.getElementById("leftBtn"),
    "left"
);

bindHold(
    document.getElementById("rightBtn"),
    "right"
);

bindHold(
    document.getElementById("brakeBtn"),
    "brake"
);

/*
    Gunner aiming.
*/

function updateAim(event){

    if(myRole !== "Gunner"){
        return;
    }

    const rect =
        world.getBoundingClientRect();

    const x =
        event.clientX -
        rect.left;

    const y =
        event.clientY -
        rect.top;

    crosshair.style.left =
        `${x}px`;

    crosshair.style.top =
        `${y}px`;

    /*
        Send normalized world coordinates.
    */

    const worldX =
        x /
        window.innerWidth *
        1000;

    const worldY =
        y /
        window.innerHeight *
        600;

    send({
        type:"aim",
        x:worldX,
        y:worldY
    });
}

world.addEventListener(
    "pointermove",
    updateAim
);

world.addEventListener(
    "pointerdown",
    event => {

        if(
            myRole !== "Gunner"
        ){
            return;
        }

        updateAim(event);

        if(
            event.target ===
            fireButton
        ){
            return;
        }

        send({
            type:"fire"
        });
    }
);

fireButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        send({
            type:"fire"
        });
    }
);

window.addEventListener(
    "resize",
    () => {

        if(currentState){
            renderState(
                currentState
            );
        }
    }
);

connect();
</script>

</body>
</html>
