<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Sky Crash</title>

<style>
*{
    box-sizing:border-box;
    image-rendering:pixelated;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:monospace;
    background:#79c8f0;
}

button{
    font-family:monospace;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            #266da9 0%,
            #428fc7 22%,
            #78badc 48%,
            #b9dce7 75%,
            #d9e9e9 100%
        );
}

#game.shake{
    animation:screenShake .5s steps(8);
}

#game.bigShake{
    animation:bigScreenShake .9s steps(12);
}

@keyframes screenShake{
    0%{transform:translate(0,0)}
    15%{transform:translate(-7px,4px)}
    30%{transform:translate(6px,-5px)}
    45%{transform:translate(-5px,-4px)}
    60%{transform:translate(5px,6px)}
    75%{transform:translate(-4px,2px)}
    100%{transform:translate(0,0)}
}

@keyframes bigScreenShake{
    0%{transform:translate(0,0)}
    10%{transform:translate(-13px,8px)}
    20%{transform:translate(11px,-9px)}
    30%{transform:translate(-10px,-7px)}
    40%{transform:translate(12px,8px)}
    50%{transform:translate(-9px,5px)}
    60%{transform:translate(8px,-7px)}
    70%{transform:translate(-6px,4px)}
    80%{transform:translate(5px,-3px)}
    90%{transform:translate(-3px,2px)}
    100%{transform:translate(0,0)}
}

/* MENU */

#planeMenu{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            rgba(15,28,40,.72),
            rgba(15,28,40,.82)
        );
}

.menuBox{
    width:min(850px,92vw);
    max-height:90vh;
    overflow:auto;
    padding:25px;
    background:#202d36;
    border:5px solid white;
    box-shadow:10px 10px 0 rgba(0,0,0,.4);
    text-align:center;
}

.menuTitle{
    color:white;
    font-size:30px;
    font-weight:bold;
    text-shadow:5px 5px 0 #111a20;
    margin-bottom:8px;
}

.menuSubtitle{
    color:#b9dce7;
    font-size:13px;
    margin-bottom:20px;
}

.planeChoices{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.planeChoice{
    min-height:175px;
    padding:10px 6px;
    color:white;
    background:#30414c;
    border:3px solid #647783;
    cursor:pointer;
    transition:.12s;
}

.planeChoice:hover{
    transform:translateY(-4px);
    background:#3d525f;
}

.planeChoice.selected{
    border-color:#fff36b;
    box-shadow:
        0 0 0 3px #e0b72e,
        6px 6px 0 rgba(0,0,0,.25);
}

.previewPlane{
    position:relative;
    width:100px;
    height:52px;
    margin:8px auto 15px;
    transform:scale(.75);
}

.planeName{
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.planeDescription{
    color:#b9c7ce;
    font-size:10px;
    line-height:1.4;
}

.stat{
    text-align:left;
    margin-top:7px;
    font-size:9px;
    color:#dce7eb;
}

.statBar{
    width:100%;
    height:6px;
    margin-top:3px;
    background:#152027;
    border:1px solid #6d7c84;
}

.statFill{
    height:100%;
    background:#ffe35c;
}

#startButton{
    margin-top:22px;
    padding:13px 30px;
    color:white;
    background:#39515e;
    border:4px solid white;
    box-shadow:6px 6px 0 rgba(0,0,0,.3);
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#startButton:hover{
    background:#4d6877;
    transform:translateY(-2px);
}

/* SUN */

#sun{
    position:absolute;
    width:90px;
    height:90px;
    right:10%;
    top:8%;
    border-radius:50%;
    background:#fff0a3;
    box-shadow:
        0 0 0 14px rgba(255,240,163,.18),
        0 0 0 30px rgba(255,240,163,.08),
        0 0 50px rgba(255,220,120,.25);
    z-index:1;
}

/* CLOUDS */

.cloud{
    position:absolute;
    height:20px;
    width:100px;
    background:#fff;
    opacity:.78;
    box-shadow:
        20px -16px 0 #fff,
        47px -22px 0 #fff,
        73px -8px 0 #fff,
        96px 0 0 #fff;
    z-index:3;
}

.cloud1{
    top:13%;
    left:-180px;
    animation:cloudMove 45s linear infinite;
}

.cloud2{
    top:29%;
    left:-250px;
    transform:scale(.8);
    animation:cloudMove 60s linear infinite;
    animation-delay:8s;
}

.cloud3{
    top:5%;
    left:-300px;
    transform:scale(.6);
    animation:cloudMove 75s linear infinite;
    animation-delay:20s;
}

.cloud4{
    top:41%;
    left:-220px;
    transform:scale(.9);
    animation:cloudMove 70s linear infinite;
    animation-delay:30s;
}

.cloud5{
    top:20%;
    left:-350px;
    transform:scale(.45);
    opacity:.5;
    animation:cloudMove 90s linear infinite;
    animation-delay:12s;
}

@keyframes cloudMove{
    from{left:-400px}
    to{left:110vw}
}

/* DISTANT CITY */

#distantCity{
    position:absolute;
    left:0;
    bottom:-15%;
    width:100%;
    height:55%;
    z-index:2;
    opacity:.22;
}

.distantBuilding{
    position:absolute;
    bottom:0;
    background:#506d81;
    border-top:4px solid #70899a;
}

.distantBuilding:after{
    content:"";
    position:absolute;
    inset:9px 6px;
    background:
        repeating-linear-gradient(
            to right,
            rgba(210,235,245,.65) 0 4px,
            transparent 4px 12px
        ),
        repeating-linear-gradient(
            to bottom,
            rgba(210,235,245,.6) 0 4px,
            transparent 4px 13px
        );
}

.db1{left:0;width:6%;height:48%}
.db2{left:6%;width:4%;height:67%}
.db3{left:11%;width:7%;height:42%}
.db4{left:18%;width:5%;height:72%}
.db5{left:24%;width:8%;height:55%}
.db6{left:33%;width:5%;height:78%}
.db7{left:39%;width:7%;height:47%}
.db8{left:47%;width:5%;height:69%}
.db9{left:54%;width:8%;height:51%}
.db10{left:63%;width:5%;height:75%}
.db11{left:69%;width:8%;height:43%}
.db12{left:78%;width:5%;height:66%}
.db13{left:84%;width:7%;height:53%}
.db14{left:92%;width:8%;height:71%}

/* CITY */

#city{
    position:absolute;
    inset:0;
    z-index:8;
}

.towerAssembly{
    position:absolute;
    width:175px;
    height:125%;
    bottom:-43%;
    transform-origin:50% 100%;
}

#towerAssembly1{
    left:27%;
}

#towerAssembly2{
    right:27%;
    height:128%;
    bottom:-46%;
}

.tower{
    position:absolute;
    inset:0;
    overflow:visible;
}

.towerSection{
    position:absolute;
    left:0;
    width:100%;
    background:
        repeating-linear-gradient(
            to right,
            #f7f8f8 0 15px,
            #d0d5d8 15px 19px,
            #ffffff 19px 35px
        );
    border-left:6px solid #a7afb4;
    border-right:6px solid #a7afb4;
    box-shadow:
        10px 0 0 rgba(48,58,65,.18),
        inset 0 0 25px rgba(70,80,90,.14);
}

.section1{
    top:0;
    height:25%;
}

.section2{
    top:25%;
    height:25%;
}

.section3{
    top:50%;
    height:25%;
}

.section4{
    top:75%;
    height:25%;
}

.sectionWindows{
    position:absolute;
    inset:18px 13px;
    background:
        repeating-linear-gradient(
            to right,
            transparent 0 17px,
            rgba(255,235,130,.8) 17px 24px,
            transparent 24px 34px
        ),
        repeating-linear-gradient(
            to bottom,
            transparent 0 22px,
            rgba(255,235,130,.65) 22px 29px,
            transparent 29px 39px
        );
    opacity:.5;
    animation:windowFlicker 2.8s steps(5) infinite;
}

@keyframes windowFlicker{
    0%,100%{opacity:.4}
    20%{opacity:.7}
    35%{opacity:.5}
    53%{opacity:.75}
    72%{opacity:.45}
}

/* ROOF */

.roof{
    position:absolute;
    top:-10px;
    left:-8px;
    width:calc(100% + 16px);
    height:10px;
    background:#858e94;
    border:3px solid #5e676d;
    z-index:20;
}

.antenna{
    position:absolute;
    bottom:100%;
    left:50%;
    width:5px;
    height:115px;
    transform:translateX(-50%);
    background:#5b646a;
    z-index:21;
}

.antenna:before{
    content:"";
    position:absolute;
    top:25px;
    left:-12px;
    width:29px;
    height:4px;
    background:#5b646a;
}

.antenna:after{
    content:"";
    position:absolute;
    top:60px;
    left:-5px;
    width:15px;
    height:4px;
    background:#5b646a;
}

/* DAMAGE */

.damageMark{
    position:absolute;
    width:75px;
    height:60px;
    z-index:30;
    display:none;
}

.damageMark:before,
.damageMark:after{
    content:"";
    position:absolute;
    background:#4c5357;
}

.damageMark:before{
    left:7px;
    top:25px;
    width:62px;
    height:8px;
    transform:rotate(-12deg);
}

.damageMark:after{
    left:30px;
    top:2px;
    width:8px;
    height:57px;
    transform:rotate(25deg);
}

.damageMark.active{
    display:block;
}

/* WINDOWS THAT FALL */

.fallingWindow{
    position:absolute;
    width:7px;
    height:5px;
    background:#ffe96a;
    border:1px solid #52636c;
    z-index:60;
    animation:windowFall 1.8s cubic-bezier(.2,.2,.4,1) forwards;
}

@keyframes windowFall{
    0%{
        transform:translate(0,0) rotate(0);
        opacity:1;
    }

    30%{
        transform:
            translate(var(--dx1),var(--dy1))
            rotate(80deg);
    }

    100%{
        transform:
            translate(var(--dx),var(--dy))
            rotate(var(--rot));
        opacity:0;
    }
}

/* PLANE */

#plane{
    position:absolute;
    width:100px;
    height:52px;
    z-index:80;
    filter:drop-shadow(5px 6px 0 rgba(0,0,0,.25));
}

.fuselage{
    position:absolute;
    left:4px;
    top:18px;
    width:91px;
    height:17px;
    background:#f2f3f3;
    border:4px solid #303a40;
    z-index:4;
}

.fuselage:after{
    content:"";
    position:absolute;
    right:-15px;
    top:1px;
    width:15px;
    height:11px;
    background:#303a40;
    clip-path:polygon(
        0 0,
        100% 50%,
        0 100%
    );
}

.cockpit{
    position:absolute;
    left:70px;
    top:21px;
    width:17px;
    height:9px;
    background:#263f52;
    border:2px solid #202b31;
    z-index:8;
}

.window{
    position:absolute;
    top:22px;
    width:6px;
    height:5px;
    background:#5bb6e8;
    border:1px solid #26343b;
    z-index:9;
}

.w1{left:23px}
.w2{left:32px}
.w3{left:41px}
.w4{left:50px}
.w5{left:59px}

.mainWing{
    position:absolute;
    left:34px;
    top:6px;
    width:48px;
    height:23px;
    background:#d5dadd;
    border:4px solid #303a40;
    clip-path:polygon(
        0 100%,
        28% 0,
        100% 0,
        66% 100%
    );
    z-index:2;
}

.lowerWing{
    position:absolute;
    left:38px;
    top:31px;
    width:43px;
    height:18px;
    background:#cbd1d4;
    border:4px solid #303a40;
    clip-path:polygon(
        0 0,
        100% 0,
        68% 100%,
        28% 100%
    );
    z-index:2;
}

.tailFin{
    position:absolute;
    left:8px;
    top:3px;
    width:22px;
    height:25px;
    background:#d8dcde;
    border:4px solid #303a40;
    clip-path:polygon(
        0 100%,
        25% 15%,
        100% 0,
        100% 100%
    );
    z-index:7;
}

.tailWing{
    position:absolute;
    left:5px;
    top:12px;
    width:25px;
    height:16px;
    background:#cbd0d3;
    border:3px solid #303a40;
    clip-path:polygon(
        0 45%,
        100% 0,
        82% 100%
    );
    z-index:3;
}

.engine{
    position:absolute;
    width:15px;
    height:11px;
    background:#68747a;
    border:3px solid #303a40;
    z-index:7;
}

.engine:after{
    content:"";
    position:absolute;
    left:2px;
    top:2px;
    width:5px;
    height:5px;
    background:#202a2f;
}

.engine1{
    left:48px;
    top:12px;
}

.engine2{
    left:48px;
    top:35px;
}

.engineSmoke{
    position:absolute;
    width:12px;
    height:9px;
    left:-9px;
    background:#272c30;
    opacity:.8;
    box-shadow:
        -9px -2px 0 #3a4044,
        -17px 1px 0 #4a5054;
    animation:engineSmoke .7s steps(4) infinite;
    z-index:1;
}

@keyframes engineSmoke{
    from{
        transform:translateX(0);
        opacity:.9;
    }
    to{
        transform:translateX(-18px);
        opacity:0;
    }
}

/* EFFECTS */

.impactFlash{
    position:absolute;
    width:90px;
    height:90px;
    z-index:90;
    background:#fff5a0;
    clip-path:polygon(
        50% 0,
        63% 29%,
        100% 18%,
        72% 50%,
        100% 68%,
        60% 65%,
        52% 100%,
        42% 66%,
        0 80%,
        28% 51%,
        0 35%,
        39% 38%
    );
    animation:flash .22s steps(3) forwards;
}

@keyframes flash{
    from{
        transform:scale(.25);
        opacity:1;
    }
    to{
        transform:scale(2);
        opacity:0;
    }
}

.fire{
    position:absolute;
    width:32px;
    height:44px;
    z-index:35;
    animation:flicker .12s steps(2) infinite alternate;
}

.fire:before{
    content:"";
    position:absolute;
    left:5px;
    bottom:0;
    width:22px;
    height:40px;
    background:#ef3514;
    clip-path:polygon(
        50% 0,
        70% 20%,
        100% 40%,
        82% 100%,
        15% 100%,
        0 60%,
        29% 42%
    );
}

.fire:after{
    content:"";
    position:absolute;
    left:11px;
    bottom:3px;
    width:12px;
    height:26px;
    background:#ffd62b;
    clip-path:polygon(
        50% 0,
        100% 50%,
        72% 100%,
        15% 100%,
        0 55%
    );
}

@keyframes flicker{
    from{transform:scale(1)}
    to{
        transform:
            scale(1.1,.93)
            translateY(-2px);
    }
}

.fireGlow{
    position:absolute;
    width:65px;
    height:50px;
    background:#ff5217;
    opacity:.24;
    filter:blur(8px);
    z-index:30;
}

/* SMOKE */

.smoke{
    position:absolute;
    width:38px;
    height:31px;
    background:#111416;
    opacity:.96;
    z-index:40;
    box-shadow:
        25px 5px 0 #1a1d20,
        -21px 9px 0 #0c0f11,
        13px -13px 0 #202428,
        -8px -18px 0 #171a1d,
        36px -10px 0 #25292c,
        -27px -3px 0 #131618;
    animation:smokeRise 4s steps(12) forwards;
}

.lightSmoke{
    background:#72797c;
    opacity:.65;
    box-shadow:
        25px 5px 0 #858b8e,
        -21px 9px 0 #686e71,
        13px -13px 0 #979c9f,
        -8px -18px 0 #7c8285;
}

@keyframes smokeRise{
    0%{
        transform:translate(0,0) scale(.55);
        opacity:1;
    }

    25%{
        transform:
            translate(
                calc(var(--drift)*.35),
                -40px
            )
            scale(.9);
        opacity:.98;
    }

    55%{
        transform:
            translate(
                calc(var(--drift)*.75),
                -105px
            )
            scale(1.6);
        opacity:.8;
    }

    100%{
        transform:
            translate(
                var(--drift),
                -225px
            )
            scale(3);
        opacity:0;
    }
}

/* GLASS */

.glass{
    position:absolute;
    width:5px;
    height:10px;
    background:#b8e9ff;
    border:1px solid #526d78;
    z-index:75;
    animation:glassFly 1.1s steps(9) forwards;
}

@keyframes glassFly{
    0%{
        transform:translate(0,0) rotate(0);
        opacity:1;
    }

    100%{
        transform:
            translate(var(--gx),var(--gy))
            rotate(var(--gr));
        opacity:0;
    }
}

/* CHUNKS */

.buildingChunk{
    position:absolute;
    background:#9fa8ac;
    border:3px solid #646d72;
    z-index:55;
    animation:chunkFall 2.3s cubic-bezier(.2,.1,.3,1) forwards;
}

@keyframes chunkFall{
    0%{
        transform:translate(0,0) rotate(0);
        opacity:1;
    }

    45%{
        transform:
            translate(
                calc(var(--cx)*.4),
                calc(var(--cy)*.35)
            )
            rotate(calc(var(--cr)*.35));
    }

    100%{
        transform:
            translate(var(--cx),var(--cy))
            rotate(var(--cr));
        opacity:0;
    }
}

/* SECTION COLLAPSE */

.sectionPiece{
    position:absolute;
    width:100%;
    height:25%;
    background:
        repeating-linear-gradient(
            to right,
            #d9dddf 0 15px,
            #aeb5b9 15px 19px,
            #f1f2f2 19px 35px
        );
    border:4px solid #717a7f;
    z-index:45;
    animation:sectionFall 3.2s cubic-bezier(.25,.1,.3,1) forwards;
}

@keyframes sectionFall{

    0%{
        transform:translate(0,0) rotate(0);
        opacity:1;
    }

    20%{
        transform:
            translate(
                calc(var(--sx)*.05),
                calc(var(--sy)*.03)
            )
            rotate(calc(var(--sr)*.1));
    }

    45%{
        transform:
            translate(
                calc(var(--sx)*.3),
                calc(var(--sy)*.25)
            )
            rotate(calc(var(--sr)*.35));
    }

    70%{
        transform:
            translate(
                calc(var(--sx)*.65),
                calc(var(--sy)*.65)
            )
            rotate(calc(var(--sr)*.7));
    }

    100%{
        transform:
            translate(var(--sx),var(--sy))
            rotate(var(--sr));
        opacity:0;
    }
}

/* DUST */

.dust{
    position:absolute;
    width:50px;
    height:32px;
    background:#8b9295;
    opacity:.75;
    z-index:43;
    box-shadow:
        25px 5px 0 #777f82,
        -22px 10px 0 #969c9f,
        10px -13px 0 #a1a6a8;
    animation:dustRise 2.8s steps(12) forwards;
}

@keyframes dustRise{
    0%{
        transform:translate(0,0) scale(.5);
        opacity:.85;
    }

    45%{
        transform:
            translate(var(--dx),-50px)
            scale(1.6);
        opacity:.7;
    }

    100%{
        transform:
            translate(
                calc(var(--dx)*1.7),
                -150px
            )
            scale(3.5);
        opacity:0;
    }
}

/* UI */

#status{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 14px;
    color:white;
    background:rgba(18,27,34,.84);
    border:3px solid white;
    font-size:14px;
    font-weight:bold;
    z-index:100;
    box-shadow:5px 5px 0 rgba(0,0,0,.25);
}

#targetStatus{
    position:absolute;
    top:65px;
    left:18px;
    padding:8px 12px;
    color:white;
    background:rgba(18,27,34,.76);
    border:2px solid white;
    font-size:12px;
    font-weight:bold;
    z-index:100;
}

#title{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:4px 4px 0 #354650;
    z-index:100;
    white-space:nowrap;
}

#resetButton{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:150;
    padding:15px 24px;
    background:#222c34;
    color:white;
    border:4px solid white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:7px 7px 0 rgba(0,0,0,.35);
}

#resetButton:hover{
    background:#354650;
    transform:
        translate(-50%,-50%)
        scale(1.05);
}

#instructions{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:120;

<script>

const game=
    document.getElementById("game");

const plane=
    document.getElementById("plane");

const planeMenu=
    document.getElementById("planeMenu");

const planeChoices=
    document.getElementById("planeChoices");

const startButton=
    document.getElementById("startButton");

const statusText=
    document.getElementById("status");

const targetStatus=
    document.getElementById("targetStatus");

const resetButton=
    document.getElementById("resetButton");

const towerAssembly1=
    document.getElementById(
        "towerAssembly1"
    );

const towerAssembly2=
    document.getElementById(
        "towerAssembly2"
    );

const backgroundMusic=
    document.getElementById(
        "backgroundMusic"
    );

const damage1=
    document.getElementById("damage1");

const damage2=
    document.getElementById("damage2");

let x=0;
let y=0;

let vx=0;
let vy=0;

let crashed=false;
let gameStarted=false;

let hitTower1=false;
let hitTower2=false;

let currentAssembly=null;
let smokeInterval=null;

let selectedPlane="airliner";
let musicStarted=false;

const keys={};

/* PLANE DATA */

const planeTypes={

    smalljet:{
        name:"SMALL JET",
        description:"Fast and agile.",
        speed:7.5,
        acceleration:.48,
        turning:.46,
        braking:.88,
        stall:1.0
    },

    airliner:{
        name:"AIRLINER",
        description:"Balanced and easy to control.",
        speed:6.7,
        acceleration:.38,
        turning:.34,
        braking:.90,
        stall:.8
    },

    largeairliner:{
        name:"LARGE AIRLINER",
        description:"Heavy with strong momentum.",
        speed:6.0,
        acceleration:.29,
        turning:.25,
        braking:.92,
        stall:.65
    },

    cargo:{
        name:"CARGO JET",
        description:"Very heavy and slow to turn.",
        speed:5.6,
        acceleration:.24,
        turning:.20,
        braking:.94,
        stall:.55
    },

    fighter:{
        name:"FAST JET",
        description:"Extremely fast and responsive.",
        speed:9.2,
        acceleration:.62,
        turning:.62,
        braking:.82,
        stall:1.2
    }

};

/* CREATE MENU */

function createPlaneMenu(){

    planeChoices.innerHTML="";

    for(
        const [id,data]
        of Object.entries(planeTypes)
    ){

        const card=
            document.createElement("div");

        card.className=
            "planeChoice";

        if(id===selectedPlane)
            card.classList.add("selected");

        card.innerHTML=`

            <div class="previewPlane">

                <div class="tailWing"></div>
                <div class="mainWing"></div>
                <div class="lowerWing"></div>
                <div class="tailFin"></div>

                <div class="engine engine1"></div>
                <div class="engine engine2"></div>

                <div class="fuselage"></div>

                <div class="cockpit"></div>

                <div class="window w1"></div>
                <div class="window w2"></div>
                <div class="window w3"></div>
                <div class="window w4"></div>
                <div class="window w5"></div>

            </div>

            <div class="planeName">
                ${data.name}
            </div>

            <div class="planeDescription">
                ${data.description}
            </div>

            <div class="stat">
                SPEED
                <div class="statBar">
                    <div
                        class="statFill"
                        style="width:${Math.min(data.speed/9.2*100,100)}%"
                    ></div>
                </div>
            </div>

            <div class="stat">
                AGILITY
                <div class="statBar">
                    <div
                        class="statFill"
                        style="width:${Math.min(data.turning/.62*100,100)}%"
                    ></div>
                </div>
            </div>
        `;

        card.addEventListener(
            "click",
            ()=>{

                selectedPlane=id;

                createPlaneMenu();

            }
        );

        planeChoices.appendChild(card);
    }
}

createPlaneMenu();

/* MUSIC */

function startMusic(){

    if(musicStarted)return;

    backgroundMusic.volume=.6;

    backgroundMusic.play().then(()=>{

        musicStarted=true;

    }).catch(()=>{

        musicStarted=false;

    });
}

/* START */

startButton.addEventListener(
    "click",
    ()=>{

        gameStarted=true;

        planeMenu.style.display=
            "none";

        statusText.textContent=
            "STATUS: FLYING";

        setStartPosition();

        startMusic();

    }
);

/* POSITION */

function setStartPosition(){

    const w=
        window.innerWidth;

    const h=
        window.innerHeight;

    x=w*.035;
    y=h*.35;

    vx=2.5;
    vy=0;

    plane.style.position=
        "absolute";

    plane.style.left=
        x+"px";

    plane.style.top=
        y+"px";

    plane.style.zIndex=
        "80";

    plane.style.transform=
        "rotate(0deg)";

    plane.style.display=
        "block";

    if(
        plane.parentElement !== game
    ){

        game.appendChild(
            plane
        );
    }
}

/* CONTROLS */

window.addEventListener(
    "keydown",
    e=>{

        if(!gameStarted)return;

        keys[
            e.key.toLowerCase()
        ]=true;

        startMusic();

    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);

function holdButton(
    element,
    key
){

    const down=e=>{

        e.preventDefault();

        if(!gameStarted)return;

        keys[key]=true;

        startMusic();

    };

    const up=e=>{

        e.preventDefault();

        keys[key]=false;

    };

    element.addEventListener(
        "pointerdown",
        down
    );

    element.addEventListener(
        "pointerup",
        up
    );

    element.addEventListener(
        "pointerleave",
        up
    );

    element.addEventListener(
        "pointercancel",
        up
    );
}

holdButton(
    document.getElementById("left"),
    "arrowleft"
);

holdButton(
    document.getElementById("right"),
    "arrowright"
);

holdButton(
    document.getElementById("up"),
    "arrowup"
);

holdButton(
    document.getElementById("down"),
    "arrowdown"
);

/* PLANE PHYSICS */

function updatePlane(){

    if(
        !gameStarted ||
        crashed
    )
        return;

    const data=
        planeTypes[selectedPlane];

    /*
       Horizontal acceleration.
    */

    if(
        keys["arrowright"] ||
        keys["d"]
    ){

        vx+=data.acceleration;

    }

    if(
        keys["arrowleft"] ||
        keys["a"]
    ){

        vx-=data.acceleration;

    }

    /*
       Vertical acceleration.
    */

    if(
        keys["arrowup"] ||
        keys["w"]
    ){

        vy-=data.turning;

    }

    if(
        keys["arrowdown"] ||
        keys["s"]
    ){

        vy+=data.turning;

    }

    /*
       Braking when opposite direction
       is pressed.
    */

    if(
        keys["arrowleft"] ||
        keys["a"]
    ){

        if(vx>0)
            vx*=data.braking;

    }

    if(
        keys["arrowright"] ||
        keys["d"]
    ){

        if(vx<0)
            vx*=data.braking;

    }

    /*
       Air resistance.
    */

    vx*=.965;
    vy*=.94;

    /*
       Stall effect.

       If the plane loses too much speed,
       it becomes difficult to keep altitude.
    */

    const speed=
        Math.sqrt(
            vx*vx+
            vy*vy
        );

    if(
        speed <
        data.stall
    ){

        vy+=.035;

    }

    /*
       Speed limits.
    */

    vx=Math.max(
        -data.speed*.65,
        Math.min(
            data.speed,
            vx
        )
    );

    vy=Math.max(
        -data.speed*.65,
        Math.min(
            data.speed*.65,
            vy
        )
    );

    x+=vx;
    y+=vy;

    const maxX=
        window.innerWidth-
        plane.offsetWidth;

    const maxY=
        window.innerHeight-
        plane.offsetHeight;

    /*
       Screen boundaries.
    */

    if(x<0){

        x=0;
        vx=Math.abs(vx)*.55;

    }

    if(x>maxX){

        x=maxX;
        vx=-Math.abs(vx)*.55;

    }

    if(y<0){

        y=0;
        vy=Math.abs(vy)*.55;

    }

    if(y>maxY){

        y=maxY;
        vy=-Math.abs(vy)*.55;

    }

    plane.style.left=
        x+"px";

    plane.style.top=
        y+"px";

    /*
       Visual pitch.
    */

    const angle=
        Math.max(
            -24,
            Math.min(
                24,
                vy*4.5
            )
        );

    plane.style.transform=
        "rotate("+angle+"deg)";

    checkCollision();
}

/* COLLISION */

function checkCollision(){

    const p=
        plane.getBoundingClientRect();

    const targets=[
        {
            tower:
                towerAssembly1.querySelector(
                    ".tower"
                ),
            assembly:
                towerAssembly1,
            hit:
                hitTower1,
            damage:
                damage1
        },
        {
            tower:
                towerAssembly2.querySelector(
                    ".tower"
                ),
            assembly:
                towerAssembly2,
            hit:
                hitTower2,
            damage:
                damage2
        }
    ];

    for(
        const target of targets
    ){

        if(target.hit)
            continue;

        if(
            target.assembly.classList.contains(
                "towerCollapsing"
            )
        )
            continue;

        const t=
            target.tower.getBoundingClientRect();

        if(
            p.right>t.left &&
            p.left<t.right &&
            p.bottom>t.top &&
            p.top<t.bottom
        ){

            crash(
                target.tower,
                target.assembly,
                target.damage,
                p
            );

            return;
        }
    }
}

/* SHAKE */

function shake(
    strong=false
){

    game.classList.remove(
        "shake",
        "bigShake"
    );

    void game.offsetWidth;

    game.classList.add(
        strong
        ? "bigShake"
        : "shake"
    );
}

/* CRASH */

function crash(
    tower,
    assembly,
    damage,
    p
){

    if(crashed)return;

    crashed=true;

    currentAssembly=
        assembly;

    vx=0;
    vy=0;

    if(
        assembly===towerAssembly1
    ){

        hitTower1=true;

    }else{

        hitTower2=true;

    }

    updateTargetStatus();

    statusText.textContent=
        "STATUS: IMPACT";

    shake(false);

    const t=
        tower.getBoundingClientRect();

    const impactX=Math.max(
        t.left,
        Math.min(
            p.left+p.width/2,
            t.right
        )
    );

    const impactY=Math.max(
        t.top,
        Math.min(
            p.top+p.height/2,
            t.bottom
        )
    );

    const localX=
        impactX-
        t.left-
        p.width/2;

    const localY=
        impactY-
        t.top-
        p.height/2;

    /*
       Embed the plane inside
       the tower assembly.
    */

    assembly.appendChild(
        plane
    );

    plane.style.position=
        "absolute";

    plane.style.left=
        localX+"px";

    plane.style.top=
        localY+"px";

    plane.style.zIndex=
        "25";

    plane.style.transform=
        "rotate(0deg)";

    /*
       Show physical damage.
    */

    damage.classList.add(
        "active"
    );

    damage.style.left=
        (localX+5)+"px";

    damage.style.top=
        (localY+5)+"px";

    createImpact(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    createGlass(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    createChunks(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    createFire(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    createSmokeCloud(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    spreadFire(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    /*
       Engine damage is visual only.
    */

    const engineSmoke=
        document.createElement(
            "div"
        );

    engineSmoke.className=
        "engineSmoke";

    engineSmoke.style.top=
        localY+10+"px";

    engineSmoke.style.left=
        localX-5+"px";

    assembly.appendChild(
        engineSmoke
    );

    /*
       Continuous smoke.
    */

    smokeInterval=
        setInterval(()=>{

            if(!crashed){

                clearInterval(
                    smokeInterval
                );

                smokeInterval=null;

                return;
            }

            createSmoke(
                assembly,

                localX+
                p.width/2+
                (Math.random()*65-32),

                localY+
                p.height/2+
                (Math.random()*40-20)
            );

        },230);

    /*
       Structural failure.
    */

    setTimeout(()=>{

        statusText.textContent=
            "STATUS: STRUCTURAL FAILURE";

        shake(true);

        collapseTower(
            assembly
        );

    },6500);
}

/* TARGET COUNTER */

function updateTargetStatus(){

    const count=
        (hitTower1?1:0)+
        (hitTower2?1:0);

    targetStatus.textContent=
        "TOWERS: "+
        count+
        " / 2 HIT";
}

/* IMPACT */

function createImpact(
    parent,
    x,
    y
){

    const flash=
        document.createElement(
            "div"
        );

    flash.className=
        "impactFlash";

    flash.style.left=
        (x-45)+"px";

    flash.style.top=
        (y-45)+"px";

    parent.appendChild(
        flash
    );

    setTimeout(
        ()=>flash.remove(),
        250
    );
}

/* GLASS */

function createGlass(
    parent,
    x,
    y
){

    for(let i=0;i<35;i++){

        const glass=
            document.createElement(
                "div"
            );

        glass.className=
            "glass";

        glass.style.left=
            x+"px";

        glass.style.top=
            y+"px";

        glass.style.setProperty(
            "--gx",
            ((Math.random()-.5)*210)+"px"
        );

        glass.style.setProperty(
            "--gy",
            ((Math.random()-.5)*160)+"px"
        );

        glass.style.setProperty(
            "--gr",
            ((Math.random()-.5)*900)+"deg"
        );

        parent.appendChild(
            glass
        );

        setTimeout(
            ()=>glass.remove(),
            1200
        );
    }
}

/* BUILDING CHUNKS */

function createChunks(
    parent,
    x,
    y
){

    for(let i=0;i<18;i++){

        const chunk=
            document.createElement(
                "div"
            );

        chunk.className=
            "buildingChunk";

        chunk.style.left=
            x+"px";

        chunk.style.top=
            y+"px";

        chunk.style.width=
            (7+Math.random()*20)+"px";

        chunk.style.height=
            (7+Math.random()*18)+"px";

        chunk.style.setProperty(
            "--cx",
            ((Math.random()-.5)*230)+"px"
        );

        chunk.style.setProperty(
            "--cy",
            ((Math.random()-.7)*170)+"px"
        );

        chunk.style.setProperty(
            "--cr",
            ((Math.random()-.5)*700)+"deg"
        );

        parent.appendChild(
            chunk
        );

        setTimeout(
            ()=>chunk.remove(),
            2400
        );
    }
}

/* FIRE */

function createFire(
    parent,
    x,
    y
){

    const offsets=[
        [-25,-8,1],
        [0,-5,1.3],
        [25,-3,.9],
        [-15,25,.85],
        [17,27,1],
        [0,48,.75]
    ];

    for(
        const o of offsets
    ){

        const fire=
            document.createElement(
                "div"
            );

        fire.className=
            "fire";

        fire.style.left=
            x+o[0]-16+"px";

        fire.style.top=
            y+o[1]-40+"px";

        fire.style.transform=
            "scale("+o[2]+")";

        parent.appendChild(
            fire
        );

        const glow=
            document.createElement(
                "div"
            );

        glow.className=
            "fireGlow";

        glow.style.left=
            x+o[0]-32+"px";

        glow.style.top=
            y+o[1]-24+"px";

        parent.appendChild(
            glow
        );
    }
}

/* FIRE SPREAD */

function spreadFire(
    parent,
    x,
    y
){

    const spots=[
        [-43,-160],
        [42,-120],
        [-38,-75],
        [45,-30],
        [-48,20],
        [34,72],
        [-22,125]
    ];

    spots.forEach(
        (spot,index)=>{

            setTimeout(()=>{

                if(!crashed)return;

                const fire=
                    document.createElement(
                        "div"
                    );

                fire.className=
                    "fire";

                fire.style.left=
                    x+spot[0]+"px";

                fire.style.top=
                    y+spot[1]+"px";

                fire.style.transform=
                    "scale("+
                    (.65+
                    Math.random()*.6)+
                    ")";

                parent.appendChild(
                    fire
                );

                const glow=
                    document.createElement(
                        "div"
                    );

                glow.className=
                    "fireGlow";

                glow.style.left=
                    x+spot[0]-15+"px";

                glow.style.top=
                    y+spot[1]+8+"px";

                parent.appendChild(
                    glow
                );

            },800+index*650);

        }
    );
}

/* SMOKE */

function createSmoke(
    parent,
    x,
    y
){

    const smoke=
        document.createElement(
            "div"
        );

    smoke.className=
        "smoke";

    /*
       Smoke close to the impact is dark.
    */

    if(
        Math.random()>.45
    ){

        smoke.classList.add(
            "lightSmoke"
        );

    }

    smoke.style.left=
        x-19+"px";

    smoke.style.top=
        y-18+"px";

    smoke.style.setProperty(
        "--drift",
        ((Math.random()-.5)*150)+"px"
    );

    parent.appendChild(
        smoke
    );

    setTimeout(
        ()=>smoke.remove(),
        4100
    );
}

/* SMOKE CLOUD */

function createSmokeCloud(
    parent,
    x,
    y
){

    for(let i=0;i<12;i++){

        createSmoke(
            parent,
            x+
            (Math.random()*65-32),

            y+
            (Math.random()*45-20)
        );
    }
}

/* WINDOWS */

function breakWindows(
    assembly
){

    const windows=
        assembly.querySelectorAll(
            ".sectionWindows"
        );

    windows.forEach(
        container=>{

            const rect=
                container.getBoundingClientRect();

            for(let i=0;i<15;i++){

                const win=
                    document.createElement(
                        "div"
                    );

                win.className=
                    "fallingWindow";

                win.style.left=
                    (
                        rect.left-
                        assembly.getBoundingClientRect().left+
                        Math.random()*
                        rect.width
                    )+"px";

                win.style.top=
                    (
                        rect.top-
                        assembly.getBoundingClientRect().top+
                        Math.random()*
                        rect.height
                    )+"px";

                win.style.setProperty(
                    "--dx1",
                    ((Math.random()-.5)*20)+"px"
                );

                win.style.setProperty(
                    "--dy1",
                    (10+Math.random()*35)+"px"
                );

                win.style.setProperty(
                    "--dx",
                    ((Math.random()-.5)*260)+"px"
                );

                win.style.setProperty(
                    "--dy",
                    (100+Math.random()*380)+"px"
                );

                win.style.setProperty(
                    "--rot",
                    ((Math.random()-.5)*900)+"deg"
                );

                assembly.appendChild(
                    win
                );

                setTimeout(
                    ()=>win.remove(),
                    1900
                );
            }
        }
    );
}

/* COLLAPSE */

function collapseTower(
    assembly
){

    if(
        assembly.classList.contains(
            "towerCollapsing"
        )
    )
        return;

    assembly.classList.add(
        "towerCollapsing"
    );

    /*
       Break windows loose first.
    */

    breakWindows(
        assembly
    );

    /*
       Remove original tower sections
       visually and replace them with
       independently moving pieces.
    */

    const sections=
        assembly.querySelectorAll(
            ".towerSection"
        );

    sections.forEach(
        (section,index)=>{

            const rect=
                section.getBoundingClientRect();

            const parentRect=
                assembly.getBoundingClientRect();

            const piece=
                document.createElement(
                    "div"
                );

            piece.className=
                "sectionPiece";

            piece.style.left=
                rect.left-parentRect.left+
                "px";

            piece.style.top=
                rect.top-parentRect.top+
                "px";

            piece.style.width=
                rect.width+"px";

            piece.style.height=
                rect.height+"px";

            /*
               Lower pieces fall farther.
            */

            piece.style.setProperty(
                "--sx",
                (
                    (index%2===0?1:-1)*
                    (80+Math.random()*150)
                )+"px"
            );

            piece.style.setProperty(
                "--sy",
                (
                    180+
                    index*45+
                    Math.random()*150
                )+"px"
            );

            piece.style.setProperty(
                "--sr",
                (
                    (index%2===0?1:-1)*
                    (8+Math.random()*35)
                )+"deg"
            );

            assembly.appendChild(
                piece
            );

            section.style.visibility=
                "hidden";

            setTimeout(
                ()=>piece.remove(),
                3400
            );
        }
    );

    /*
       Remove roof and antenna from the
       original visual after pieces start.
    */

    setTimeout(()=>{

        const roof=
            assembly.querySelector(
                ".roof"
            );

        const antenna=
            assembly.querySelector(
                ".antenna"
            );

        if(roof)
            roof.style.visibility=
                "hidden";

        if(antenna)
            antenna.style.visibility=
                "hidden";

    },500);

    /*
       Large structural chunks.
    */

    for(let i=0;i<32;i++){

        setTimeout(()=>{

            const chunk=
                document.createElement(
                    "div"
                );

            chunk.className=
                "buildingChunk";

            chunk.style.left=
                Math.random()*
                assembly.offsetWidth+
                "px";

            chunk.style.top=
                Math.random()*
                assembly.offsetHeight*.8+
                "px";

            chunk.style.width=
                (10+Math.random()*28)+"px";

            chunk.style.height=
                (8+Math.random()*25)+"px";

            chunk.style.setProperty(
                "--cx",
                ((Math.random()-.5)*400)+"px"
            );

            chunk.style.setProperty(
                "--cy",
                (120+Math.random()*400)+"px"
            );

            chunk.style.setProperty(
                "--cr",
                ((Math.random()-.5)*900)+"deg"
            );

            assembly.appendChild(
                chunk
            );

            setTimeout(
                ()=>chunk.remove(),
                2400
            );

        },i*80);
    }

    /*
       Dust cloud.
    */

    for(let i=0;i<35;i++){

        setTimeout(()=>{

            const dust=
                document.createElement(
                    "div"
                );

            dust.className=
                "dust";

            dust.style.left=
                Math.random()*
                assembly.offsetWidth+
                "px";

            dust.style.top=
                assembly.offsetHeight-
                25+
                "px";

            dust.style.setProperty(
                "--dx",
                ((Math.random()-.5)*240)+"px"
            );

            assembly.appendChild(
                dust
            );

            setTimeout(
                ()=>dust.remove(),
                2900
            );

        },i*120);
    }

    /*
       Hide the original assembly after
       the sections have visibly separated.
    */

    setTimeout(()=>{

        clearInterval(
            smokeInterval
        );

        smokeInterval=null;

        removeEffectsFrom(
            assembly
        );

        assembly.style.visibility=
            "hidden";

        plane.style.display=
            "none";

        /*
           One tower remaining:
           spawn a new plane.
        */

        if(
            hitTower1 &&
            hitTower2
        ){

            statusText.textContent=
                "STATUS: ROUND COMPLETE";

            targetStatus.textContent=
                "TOWERS: 2 / 2 HIT";

            setTimeout(()=>{

                resetButton.style.display=
                    "block";

            },1200);

        }else{

            statusText.textContent=
                "STATUS: NEW PLANE READY";

            setTimeout(
                spawnNextPlane,
                1300
            );
        }

    },5000);
}

/* REMOVE EFFECTS */

function removeEffectsFrom(
    parent
){

    parent.querySelectorAll(
        ".fire,"+
        ".fireGlow,"+
        ".smoke,"+
        ".spark,"+
        ".glass,"+
        ".buildingChunk,"+
        ".sectionPiece,"+
        ".dust,"+
        ".fallingWindow,"+
        ".engineSmoke,"+
        ".impactFlash"
    ).forEach(
        el=>el.remove()
    );
}

/* NEXT PLANE */

function spawnNextPlane(){

    crashed=false;

    currentAssembly=null;

    clearInterval(
        smokeInterval
    );

    smokeInterval=null;

    if(
        plane.parentElement !== game
    ){

        game.appendChild(
            plane
        );
    }

    plane.style.display=
        "block";

    plane.style.position=
        "absolute";

    plane.style.zIndex=
        "80";

    plane.style.filter=
        "drop-shadow(5px 6px 0 rgba(0,0,0,.25))";

    statusText.textContent=
        hitTower1 &&
        !hitTower2
        ? "STATUS: HIT THE SECOND TOWER"
        : "STATUS: HIT THE FIRST TOWER";

    setStartPosition();
}

/* RESET */

function resetGame(){

    crashed=false;
    gameStarted=true;

    currentAssembly=null;

    clearInterval(
        smokeInterval
    );

    smokeInterval=null;

    hitTower1=false;
    hitTower2=false;

    updateTargetStatus();

    /*
       Restore tower assemblies.
    */

    [towerAssembly1,towerAssembly2]
    .forEach(
        assembly=>{

            removeEffectsFrom(
                assembly
            );

            assembly.classList.remove(
                "towerCollapsing"
            );

            assembly.style.visibility=
                "visible";

            assembly
                .querySelectorAll(
                    ".towerSection"
                )
                .forEach(
                    section=>{
                        section.style.visibility=
                            "visible";
                    }
                );

            assembly
                .querySelectorAll(
                    ".roof,.antenna"
                )
                .forEach(
                    part=>{
                        part.style.visibility=
                            "visible";
                    }
                );
        }
    );

    damage1.classList.remove(
        "active"
    );

    damage2.classList.remove(
        "active"
    );

    damage1.style.display="";
    damage2.style.display="";

    game.classList.remove(
        "shake",
        "bigShake"
    );

    if(
        plane.parentElement !== game
    ){

        game.appendChild(
            plane
        );
    }

    plane.style.display=
        "block";

    plane.style.position=
        "absolute";

    plane.style.zIndex=
        "80";

    statusText.textContent=
        "STATUS: FLYING";

    resetButton.style.display=
        "none";

    setStartPosition();

    backgroundMusic.currentTime=
        0;

    musicStarted=false;

    startMusic();
}

/* RESET BUTTON */

resetButton.addEventListener(
    "click",
    resetGame
);

/* RESIZE */

window.addEventListener(
    "resize",
    ()=>{

        if(
            gameStarted &&
            !crashed &&
            plane.parentElement===game
        ){

            setStartPosition();

        }

    }
);

/* START STATE */

plane.style.display=
    "none";

backgroundMusic.volume=.6;

/* LOOP */

function loop(){

    updatePlane();

    requestAnimationFrame(
        loop
    );
}

loop();

</script>

</body>
</html>
