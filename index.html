        if(event.key === "ArrowUp"){

        if(event.key === "ArrowDown"){

function selectPlane(type){

    if(!planeData[type]){
        return;

    selectedPlane=type;

    stats =
        planeData[type];

    /*
       IMPORTANT:
       Switching aircraft does NOT
       teleport the player.
    */

    velocity =
        Math.min(
            velocity,
            stats.maxSpeed
        );

    /*
       Reset vertical momentum so
       changing aircraft doesn't make
       the new aircraft instantly dive.
    */

    verticalVelocity=0;

    /*
       Keep the aircraft where it was.
    */

    plane.style.left =
        px+"%";

    plane.style.top =
        py+"%";

    document
    .querySelectorAll(".planeOption")
    .forEach(

                "selected",

                type
            );

        }
    );

        "none";

        stats.name+" SELECTED";

            ){

            }

    );

/* =========================
   RECTANGLE COLLISION
========================= */

function getPlaneRect(){

    return plane.getBoundingClientRect();

}


function getTowerRect(tower){

    return tower.getBoundingClientRect();

}


function rectsOverlap(a,b){

    return !(
        a.right <= b.left ||
        a.left >= b.right ||
        a.bottom <= b.top ||
        a.top >= b.bottom
    );

}


/* =========================
   COLLISION
========================= */

function checkCollision(){

    if(
        crashed ||
        crashCooldown ||
        inputLocked
    ){
        return;
    }

    const p =
        getPlaneRect();

    /*
       Only collide with the actual
       visible tower element.
    */

    if(
        !hitTower1 &&
        !tower1Destroyed &&
        tower1.style.visibility !==
            "hidden"
    ){

        const t1 =
            getTowerRect(tower1);

        if(rectsOverlap(p,t1)){

            hitTower1=true;

            crash(
                p,
                tower1,
                towerAssembly1,
                1
            );

            return;
        }
    }

    if(
        hitTower1 &&
        !hitTower2 &&
        !tower2Destroyed &&
        tower2.style.visibility !==
            "hidden"
    ){

        const t2 =
            getTowerRect(tower2);

        if(rectsOverlap(p,t2)){

            hitTower2=true;

            crash(
                p,
                tower2,
                towerAssembly2,
                2
            );

        }
    }
}


/* =========================
   CRASH
========================= */

function crash(
    planeRect,
    tower,
    towerAssembly,
    number
){

    if(crashed){
        return;
    }

    crashed=true;

    crashCooldown=true;

    inputLocked=true;

    planeMenu.style.display =
        "none";

    /*
       Kill movement.
    */

    velocity *= .15;

    verticalVelocity =
        number === 1
        ? .15
        : -.15;

    statusText.textContent =
        "IMPACT — BUILDING DAMAGE";

    message.textContent =
        "IMPACT";

    createImpactEffects(
        planeRect,
        number
    );

    damageEngine();

    /*
       The original tower is hidden
       only after the impact effects
       are placed.
    */

    createCollapsePieces(
        towerAssembly,
        number
    );

    tower.style.visibility =
        "hidden";

    /*
       Start collapse after a short
       impact pause.
    */

    setTimeout(
        function(){

            startTowerCollapse(
                towerAssembly,
                number
            );

        },
        500
    );

    /*
       Finish crash sequence.
    */

    setTimeout(
        function(){

            crashCooldown=false;

            if(number===1){

                tower1Destroyed=true;

                firstCrashFinished=true;

                prepareSecondFlight();

            }else{

                tower2Destroyed=true;

                finishRound();

            }

        },
        6500
    );
}


/* =========================
   IMPACT EFFECTS
========================= */

function createImpactEffects(
    planeRect,
    number
){

    const gameRect =
        game.getBoundingClientRect();

    const impactX =
        planeRect.left -
        gameRect.left +
        planeRect.width*.72;

    const impactY =
        planeRect.top -
        gameRect.top +
        planeRect.height*.5;

    const mark =
        document.createElement(
            "div"
        );

    mark.className =
        "damageMark";

    mark.style.left =
        (impactX-30)+"px";

    mark.style.top =
        (impactY-40)+"px";

    game.appendChild(mark);

    setTimeout(
        function(){
            mark.remove();
        },
        10000
    );

    createFlash(
        impactX,
        impactY
    );

    /*
       Glass
    */

    for(
        let i=0;
        i<18;
        i++
    ){

        createGlass(
            impactX,
            impactY
        );

    }

    /*
       Fire near impact.
    */

    for(
        let i=0;
        i<13;
        i++
    ){

        createFire(
            impactX+
            random(-45,45),

            impactY+
            random(-70,70)
        );

    }

    /*
       Dark smoke near impact.
    */

    for(
        let i=0;
        i<11;
        i++
    ){

        createSmoke(
            impactX+
            random(-35,35),

            impactY+
            random(-40,40),

            false
        );

    }

    /*
       Lighter smoke higher up.
    */

    for(
        let i=0;
        i<9;
        i++
    ){

        createSmoke(
            impactX+
            random(-65,65),

            impactY-
            random(60,180),

            true
        );

    }

    /*
       Building chunks.
    */

    for(
        let i=0;
        i<12;
        i++
    ){

        createChunk(
            impactX+
            random(-45,45),

            impactY+
            random(-50,70)
        );

    }
}


function random(min,max){

    return Math.random()*
        (max-min)+min;

}

/* =========================
   ENGINE DAMAGE
========================= */

function damageEngine(){

    /*
       Don't repeatedly damage engines.
    */

    if(
        engine1Damaged ||
        engine2Damaged
    ){
        return;
    }

    const damaged =
        Math.random()<.5
        ? 1
        : 2;

    if(damaged===1){
        engine1Damaged=true;
    }else{
        engine2Damaged=true;
    }

    /*
       One controlled smoke loop.
    */

    let smokeCount=0;

    const smokeTimer =
        setInterval(
            function(){

                if(
                    smokeCount>=14 ||
                    !crashed
                ){

                    clearInterval(
                        smokeTimer
                    );

                    return;
                }

                const smoke =
                    document.createElement(
                        "div"
                    );

                smoke.className =
                    "engineSmoke";

                smoke.style.left =
                    damaged===1
                    ? "67px"
                    : "105px";

                smoke.style.top =
                    "48px";

                plane.appendChild(smoke);

                setTimeout(
                    function(){
                        smoke.remove();
                    },
                    900
                );

                smokeCount++;

            },
            220
        );
}


/* =========================
   COLLAPSE PIECES
========================= */

function createCollapsePieces(
    assembly,
    number
){

    const old =
        assembly.querySelector(
            ".collapsePieces"
        );

    if(old){
        old.remove();
    }

    const pieces =
        document.createElement(
            "div"
        );

    pieces.className =
        "collapsePieces";

    assembly.appendChild(pieces);

    const width =
        assembly.clientWidth;

    const height =
        assembly.clientHeight;

    const sectionHeight =
        height/4;

    /*
       Four large sections.
    */

    for(
        let i=0;
        i<4;
        i++
    ){

        const section =
            document.createElement(
                "div"
            );

        section.className =
            "collapseSection";

        section.style.left =
            "0px";

        section.style.top =
            (i*sectionHeight)+"px";

        section.style.width =
            width+"px";

        section.style.height =
            (sectionHeight+4)+"px";

        /*
           Each section gets a different
           direction.
        */

        let horizontal =
            (i-1.5)*(
                number===1
                ? 75
                : 95
            );

        horizontal +=
            random(-30,30);

        let vertical =
            120+
            i*95+
            random(-25,60);

        let rotation =
            random(-35,35);

        section.style.setProperty(
            "--sx",
            horizontal+"px"
        );

        section.style.setProperty(
            "--sy",
            vertical+"px"
        );

        section.style.setProperty(
            "--sr",
            rotation+"deg"
        );

        section.style.setProperty(
            "--st",
            random(2.2,3.7)+"s"
        );

        /*
           Top section gets a roof-like
           strip so the collapse still
           resembles the original tower.
        */

        if(i===0){

            const roof =
                document.createElement(
                    "div"
                );

            roof.style.position =
                "absolute";

            roof.style.left =
                "-8px";

            roof.style.top =
                "-10px";

            roof.style.width =
                "calc(100% + 16px)";

            roof.style.height =
                "10px";

            roof.style.background =
                "#858e94";

            roof.style.border =
                "3px solid #5e676d";

            roof.style.zIndex =
                "5";

            section.appendChild(
                roof
            );

        }

        pieces.appendChild(
            section
        );
    }

    createFallingWindows(
        assembly,
        width,
        height
    );
}


/* =========================
   FALLING WINDOWS
========================= */

function createFallingWindows(
    assembly,
    width,
    height
){

    /*
       Keep count reasonable so
       mobile devices don't get flooded.
    */

    const columns =
        Math.max(
            4,
            Math.floor(width/18)
        );

    const rows =
        Math.max(
            8,
            Math.floor(height/65)
        );

    const count =
        Math.min(
            columns*rows,
            75
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        const window =
            document.createElement(
                "div"
            );

        window.className =
            "fallingWindow";

        window.style.left =
            random(
                15,
                Math.max(20,width-15)
            )+"px";

        window.style.top =
            random(
                25,
                Math.max(30,height-25)
            )+"px";

        window.style.setProperty(
            "--wx",
            random(-180,180)+"px"
        );

        window.style.setProperty(
            "--wy",
            random(180,600)+"px"
        );

        window.style.setProperty(
            "--wr",
            random(-500,500)+"deg"
        );

        window.style.setProperty(
            "--wt",
            random(1.5,4)+"s"
        );

        assembly.appendChild(
            window
        );

        setTimeout(
            function(){
                window.remove();
            },
            5200
        );
    }
}


/* =========================
   START COLLAPSE
========================= */

function startTowerCollapse(
    assembly,
    number
){

    const sections =
        assembly.querySelectorAll(
            ".collapseSection"
        );

    /*
       Sections already have their
       animation. Force browser to
       recognize it immediately.
    */

    sections.forEach(
        function(section){

            void section.offsetWidth;

            section.style.animationPlayState =
                "running";

        }
    );

    /*
       Dust appears later, when pieces
       reach the ground.
    */

    setTimeout(
        function(){

            createDustAtBottom(
                assembly
            );

        },
        1700
    );

    setTimeout(
        function(){

            createDustAtBottom(
                assembly
            );

        },
        2400
    );
}


/* =========================
   DUST
========================= */

function createDustAtBottom(
    assembly
){

    const rect =
        assembly.getBoundingClientRect();

    const gameRect =
        game.getBoundingClientRect();

    for(
        let i=0;
        i<4;
        i++
    ){

        const dust =
            document.createElement(
                "div"
            );

        dust.className =
            "dust";

        dust.style.left =
            (
                rect.left-
                gameRect.left+
                random(0,rect.width)
            )+"px";

        dust.style.top =
            (
                rect.bottom-
                gameRect.top-
                random(15,55)
            )+"px";

        game.appendChild(
            dust
        );

        setTimeout(
            function(){
                dust.remove();
            },
            2500
        );
    }
}

========================= */

function finishRound(){

    crashCooldown=false;

    inputLocked=true;

    roundComplete=true;

    velocity=0;

    verticalVelocity=0;

    statusText.textContent =

    message.innerHTML =

       Add a real Fly Again button.

        document.createElement(
            "button"
        );

    again.id =
        "flyAgainButton";

    again.textContent =
        "FLY AGAIN";

    again.style.position =
        "absolute";

        "50%";

    again.style.top =

    again.style.transform =
        "translateX(-50%)";

    again.style.zIndex =
        "1500";

    again.style.padding =

    again.style.border =

    again.style.background =

            again.remove();

        };

    );

/* =========================
   RESET
========================= */

function resetGame(){

    document
    .querySelectorAll(
        ".fallingWindow,"+
        ".buildingChunk,"+
        ".glass,"+
        ".fire,"+
        ".smoke,"+
        ".lightSmoke,"+
        ".dust,"+
        ".damageMark,"+
        ".impactFlash"
    )
    .forEach(
        function(element){
            element.remove();
        }
    );

    towerAssembly1
        .querySelector(
            ".collapsePieces"
        )
        ?.remove();

    towerAssembly2
        .querySelector(
            ".collapsePieces"
        )
        ?.remove();

    towerAssembly1.style.transform =
        "";

    towerAssembly2.style.transform =
        "";

    tower1.style.visibility =
        "visible";

    tower2.style.visibility =
        "visible";

    px=3.5;

    py=35;

    velocity=0;

    verticalVelocity=0;

    pitch=0;

    crashed=false;

    crashCooldown=false;

    inputLocked=false;

    hitTower1=false;

    hitTower2=false;

    tower1Destroyed=false;

    tower2Destroyed=false;

    roundComplete=false;

    firstCrashFinished=false;

    engine1Damaged=false;

    engine2Damaged=false;

    plane.style.left =
        px+"%";

    plane.style.top =
        py+"%";

    plane.style.transform =
        "rotate(0deg)";

    planeMenu.style.display =
        "none";

    const again =
        document.getElementById(
            "flyAgainButton"
        );

    if(again){
        again.remove();
    }

    statusText.textContent =
        "W / ▲ TO ACCELERATE";

    message.textContent =
        "";

}


/* =========================
   FLIGHT PHYSICS
========================= */

function updatePhysics(dt){

    if(
        crashed ||
        roundComplete ||
        inputLocked ||
        planeMenu.style.display ===
            "block"
    ){
        return;
    }

    /*
       Desktop W / S.
    */

    const accelerate =
        up ||
        keys["w"];

    const brake =
        down ||
        keys["s"] ||
        keys[" "];


    /*
       A / D.
    */

    const turnLeft =
        left ||
        keys["a"];

    const turnRight =
        right ||
        keys["d"];


    /*
       ACCELERATION

       IMPORTANT:
       There is NO automatic acceleration.

       The plane stays still until the
       player presses W / UP.
    */

    if(accelerate){

        velocity +=
            stats.acceleration*
            dt;

    }else if(brake){

        velocity -=
            stats.braking*
            dt;

    }


    /*
       Natural drag.
       Very small, so releasing W
       doesn't instantly stop the plane.
    */

    if(
        !accelerate &&
        !brake
    ){

        velocity -=
            .22*
            dt;

    }


    velocity =
        Math.max(
            0,
            Math.min(
                velocity,
                stats.maxSpeed
            )
        );


    /*
       TURNING
    */

    let horizontalTurn=0;

    if(turnLeft){
        horizontalTurn -=
            stats.turn*
            dt;
    }

    if(turnRight){
        horizontalTurn +=
            stats.turn*
            dt;
    }

    px +=
        horizontalTurn*
        velocity/
        Math.max(
            stats.maxSpeed,
            .1
        );


    /*
       VERTICAL FLIGHT

       Up = climb
       Down = descend
    */

    if(accelerate && !brake){

        /*
           Small natural climb only while
           the player is actually accelerating.
        */

        if(keys["w"] || up){
            verticalVelocity -=
                stats.climb*
                .00045*
                dt;
        }

    }

    if(
        keys["s"] ||
        down
    ){

        verticalVelocity +=
            stats.climb*
            .00065*
            dt;

    }


    /*
       If no vertical input, velocity
       slowly returns toward level.
    */

    if(
        !keys["w"] &&
        !up &&
        !keys["s"] &&
        !down
    ){

        verticalVelocity *=
            Math.pow(
                .90,
                dt
            );

    }


    /*
       Stall.

       A slow aircraft cannot climb
       forever.
    */

    if(
        (keys["w"] || up) &&
        velocity <
            stats.maxSpeed*
            stats.stall
    ){

        verticalVelocity +=
            25*
            dt;

        statusText.textContent =
            "STALL — TOO SLOW";

    }else{

        if(
            !hitTower1 &&
            !hitTower2
        ){

            statusText.textContent =
                velocity <= .05
                ? "W / ▲ TO ACCELERATE"
                : "FLY TOWARD THE BUILDINGS";

        }

    }


    /*
       Limit vertical speed.
    */

    verticalVelocity =
        Math.max(
            -2.8,
            Math.min(
                verticalVelocity,
                2.8
            )
        );


    /*
       Convert vertical velocity
       into screen position.
    */

    py +=
        verticalVelocity*
        dt;


    /*
       Screen boundaries.
    */

    if(py<5){

        py=5;

        verticalVelocity=
            Math.max(
                verticalVelocity,
                0
            );

    }

    if(py>76){

        py=76;

        verticalVelocity=
            Math.min(
                verticalVelocity,
                0
            );

    }


    /*
       Keep the plane within the
       horizontal playable area.

       It does NOT wrap around anymore.
    */

    if(px>96){

        px=96;

        velocity=0;

    }

    if(px<0){

        px=0;

        velocity=0;

    }


    /*
       Plane banking.

       Turning left/right makes the
       aircraft visually bank.
    */

    let targetPitch=0;

    if(turnLeft){
        targetPitch=-12;
    }

    if(turnRight){
        targetPitch=12;
    }

    if(accelerate && velocity>1){
        targetPitch +=
            verticalVelocity*
            4;
    }

    pitch +=
        (
            targetPitch-
            pitch
        )*
        Math.min(
            1,
            .12*dt
        );


    /*
       Render.
    */

    plane.style.left =
        px+"%";

    plane.style.top =
        py+"%";

    plane.style.transform =
        "rotate("+pitch+"deg)";
}


/* =========================
   MAIN LOOP
========================= */

function gameLoop(now){

    const dt =
        Math.min(
            .05,
            (now-lastTime)/
            1000
        );

    lastTime=now;

    updatePhysics(
        dt
    );

    checkCollision();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   START
========================= */

selectPlane(
    "airliner"
);

velocity=0;

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
