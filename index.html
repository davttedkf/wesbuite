<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Sky Crash</title>

<style>
*{
    box-sizing:border-box;
    image-rendering:pixelated;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:monospace;
    background:#79c8f0;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            #266da9 0%,
            #428fc7 22%,
            #78badc 48%,
            #b9dce7 75%,
            #d9e9e9 100%
        );
}

#game.shake{
    animation:screenShake .55s steps(8);
}

#game.bigShake{
    animation:bigScreenShake .9s steps(12);
}

@keyframes screenShake{
    0%{transform:translate(0,0)}
    12%{transform:translate(-7px,4px)}
    25%{transform:translate(6px,-5px)}
    37%{transform:translate(-5px,-4px)}
    50%{transform:translate(5px,6px)}
    62%{transform:translate(-4px,2px)}
    75%{transform:translate(4px,-3px)}
    87%{transform:translate(-2px,2px)}
    100%{transform:translate(0,0)}
}

@keyframes bigScreenShake{
    0%{transform:translate(0,0)}
    10%{transform:translate(-13px,8px)}
    20%{transform:translate(11px,-9px)}
    30%{transform:translate(-10px,-7px)}
    40%{transform:translate(12px,8px)}
    50%{transform:translate(-9px,5px)}
    60%{transform:translate(8px,-7px)}
    70%{transform:translate(-6px,4px)}
    80%{transform:translate(5px,-3px)}
    90%{transform:translate(-3px,2px)}
    100%{transform:translate(0,0)}
}

/* SUN */

#sun{
    position:absolute;
    width:90px;
    height:90px;
    right:10%;
    top:8%;
    border-radius:50%;
    background:#fff0a3;
    box-shadow:
        0 0 0 14px rgba(255,240,163,.18),
        0 0 0 30px rgba(255,240,163,.08),
        0 0 50px rgba(255,220,120,.25);
    z-index:1;
}

/* CLOUDS */

.cloud{
    position:absolute;
    height:20px;
    width:100px;
    background:#fff;
    opacity:.78;
    box-shadow:
        20px -16px 0 #fff,
        47px -22px 0 #fff,
        73px -8px 0 #fff,
        96px 0 0 #fff;
    z-index:3;
}

.cloud1{
    top:13%;
    left:-180px;
    animation:cloudMove 45s linear infinite;
}

.cloud2{
    top:29%;
    left:-250px;
    transform:scale(.8);
    animation:cloudMove 60s linear infinite;
    animation-delay:8s;
}

.cloud3{
    top:5%;
    left:-300px;
    transform:scale(.6);
    animation:cloudMove 75s linear infinite;
    animation-delay:20s;
}

.cloud4{
    top:41%;
    left:-220px;
    transform:scale(.9);
    animation:cloudMove 70s linear infinite;
    animation-delay:30s;
}

.cloud5{
    top:20%;
    left:-350px;
    transform:scale(.45);
    opacity:.5;
    animation:cloudMove 90s linear infinite;
    animation-delay:12s;
}

.cloud6{
    top:53%;
    left:-400px;
    transform:scale(.65);
    opacity:.4;
    animation:cloudMove 100s linear infinite;
    animation-delay:38s;
}

@keyframes cloudMove{
    from{left:-400px}
    to{left:110vw}
}

/* DISTANT CITY */

#distantCity{
    position:absolute;
    left:0;
    bottom:-15%;
    width:100%;
    height:55%;
    z-index:2;
    opacity:.22;
}

.distantBuilding{
    position:absolute;
    bottom:0;
    background:#506d81;
    border-top:4px solid #70899a;
}

.distantBuilding:after{
    content:"";
    position:absolute;
    inset:9px 6px;
    background:
        repeating-linear-gradient(
            to right,
            rgba(210,235,245,.65) 0 4px,
            transparent 4px 12px
        ),
        repeating-linear-gradient(
            to bottom,
            rgba(210,235,245,.6) 0 4px,
            transparent 4px 13px
        );
}

.db1{left:0;width:6%;height:48%}
.db2{left:6%;width:4%;height:67%}
.db3{left:11%;width:7%;height:42%}
.db4{left:18%;width:5%;height:72%}
.db5{left:24%;width:8%;height:55%}
.db6{left:33%;width:5%;height:78%}
.db7{left:39%;width:7%;height:47%}
.db8{left:47%;width:5%;height:69%}
.db9{left:54%;width:8%;height:51%}
.db10{left:63%;width:5%;height:75%}
.db11{left:69%;width:8%;height:43%}
.db12{left:78%;width:5%;height:66%}
.db13{left:84%;width:7%;height:53%}
.db14{left:92%;width:8%;height:71%}

/* DISTANT PLANES */

.distantPlane{
    position:absolute;
    width:42px;
    height:18px;
    z-index:4;
    opacity:.35;
    animation:flyAcross linear infinite;
}

.distantPlane:before{
    content:"";
    position:absolute;
    left:7px;
    top:7px;
    width:30px;
    height:5px;
    background:#3b5360;
}

.distantPlane:after{
    content:"";
    position:absolute;
    left:17px;
    top:2px;
    width:17px;
    height:12px;
    background:#536c78;
    clip-path:polygon(
        0 45%,
        100% 0,
        72% 100%
    );
}

.dp1{
    top:18%;
    left:-60px;
    animation-duration:34s;
}

.dp2{
    top:34%;
    left:-80px;
    transform:scale(.65);
    animation-duration:47s;
    animation-delay:12s;
}

.dp3{
    top:10%;
    left:-100px;
    transform:scale(.45);
    animation-duration:58s;
    animation-delay:24s;
}

@keyframes flyAcross{
    from{left:-100px}
    to{left:110vw}
}

/* BIRDS */

.bird{
    position:absolute;
    width:28px;
    height:16px;
    z-index:12;
    animation:birdFly linear infinite;
}

.bird:before,
.bird:after{
    content:"";
    position:absolute;
    top:7px;
    width:12px;
    height:4px;
    border-top:3px solid #263943;
}

.bird:before{
    left:1px;
    transform:rotate(25deg);
}

.bird:after{
    right:1px;
    transform:rotate(-25deg);
}

.bird1{
    top:25%;
    animation-duration:18s;
}

.bird2{
    top:38%;
    transform:scale(.7);
    animation-duration:25s;
    animation-delay:7s;
}

.bird3{
    top:15%;
    transform:scale(.5);
    animation-duration:31s;
    animation-delay:14s;
}

.bird4{
    top:48%;
    transform:scale(.8);
    animation-duration:22s;
    animation-delay:18s;
}

@keyframes birdFly{
    0%{
        left:-60px;
        margin-top:0;
    }

    25%{
        margin-top:-12px;
    }

    50%{
        margin-top:3px;
    }

    75%{
        margin-top:-9px;
    }

    100%{
        left:110vw;
        margin-top:0;
    }
}

/* CITY */

#city{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:8;
}

/* TOWER ASSEMBLY */

.towerAssembly{
    position:absolute;
    width:175px;
    height:125%;
    bottom:-43%;
    transform-origin:50% 100%;
}

#towerAssembly1{
    left:27%;
}

#towerAssembly2{
    right:27%;
    height:128%;
    bottom:-46%;
}

.tower{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:
        repeating-linear-gradient(
            to right,
            #f7f8f8 0 15px,
            #d0d5d8 15px 19px,
            #ffffff 19px 35px
        );
    border-left:6px solid #a7afb4;
    border-right:6px solid #a7afb4;
    box-shadow:
        14px 0 0 rgba(48,58,65,.22),
        inset 0 0 30px rgba(70,80,90,.16);
    overflow:visible;
}

.tower:before{
    content:"";
    position:absolute;
    inset:18px 12px;
    background:
        repeating-linear-gradient(
            to bottom,
            #405a6b 0 7px,
            #9db5c4 7px 11px,
            #314652 11px 15px,
            transparent 15px 28px
        );
    opacity:.94;
}

.tower:after{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:7px;
    transform:translateX(-50%);
    background:#bdc4c8;
    opacity:.8;
}

/* WINDOWS */

.windowGrid{
    position:absolute;
    inset:25px 19px;
    z-index:3;
    background:
        repeating-linear-gradient(
            to right,
            transparent 0 17px,
            rgba(255,235,130,.85) 17px 24px,
            transparent 24px 34px
        ),
        repeating-linear-gradient(
            to bottom,
            transparent 0 22px,
            rgba(255,235,130,.7) 22px 29px,
            transparent 29px 39px
        );
    mix-blend-mode:screen;
    opacity:.55;
    animation:windowFlicker 2.8s steps(5) infinite;
}

@keyframes windowFlicker{
    0%,100%{opacity:.42}
    20%{opacity:.72}
    35%{opacity:.5}
    53%{opacity:.78}
    72%{opacity:.48}
}

/* ROOF */

.roof{
    position:absolute;
    top:-10px;
    left:-8px;
    width:calc(100% + 16px);
    height:10px;
    background:#858e94;
    border:3px solid #5e676d;
    z-index:4;
}

.antenna{
    position:absolute;
    bottom:100%;
    left:50%;
    width:5px;
    height:115px;
    transform:translateX(-50%);
    background:#5b646a;
    z-index:5;
}

.antenna:before{
    content:"";
    position:absolute;
    top:25px;
    left:-12px;
    width:29px;
    height:4px;
    background:#5b646a;
}

.antenna:after{
    content:"";
    position:absolute;
    top:60px;
    left:-5px;
    width:15px;
    height:4px;
    background:#5b646a;
}

/* REALISTIC PIXEL PLANE */

#plane{
    position:absolute;
    width:100px;
    height:52px;
    z-index:80;
    filter:drop-shadow(5px 6px 0 rgba(0,0,0,.25));
}

.fuselage{
    position:absolute;
    left:4px;
    top:18px;
    width:91px;
    height:17px;
    background:#f2f3f3;
    border:4px solid #303a40;
}

.fuselage:after{
    content:"";
    position:absolute;
    right:-15px;
    top:1px;
    width:15px;
    height:11px;
    background:#303a40;
    clip-path:polygon(
        0 0,
        100% 50%,
        0 100%
    );
}

.cockpit{
    position:absolute;
    left:70px;
    top:21px;
    width:17px;
    height:9px;
    background:#263f52;
    border:2px solid #202b31;
    clip-path:polygon(
        0 0,
        100% 20%,
        100% 100%,
        0 100%
    );
    z-index:5;
}

.window{
    position:absolute;
    top:22px;
    width:6px;
    height:5px;
    background:#5bb6e8;
    border:1px solid #26343b;
    z-index:6;
}

.w1{left:23px}
.w2{left:32px}
.w3{left:41px}
.w4{left:50px}
.w5{left:59px}

.mainWing{
    position:absolute;
    left:34px;
    top:6px;
    width:48px;
    height:23px;
    background:#d5dadd;
    border:4px solid #303a40;
    clip-path:polygon(
        0 100%,
        28% 0,
        100% 0,
        66% 100%
    );
    z-index:2;
}

.lowerWing{
    position:absolute;
    left:38px;
    top:31px;
    width:43px;
    height:18px;
    background:#cbd1d4;
    border:4px solid #303a40;
    clip-path:polygon(
        0 0,
        100% 0,
        68% 100%,
        28% 100%
    );
    z-index:2;
}

.tailFin{
    position:absolute;
    left:8px;
    top:3px;
    width:22px;
    height:25px;
    background:#d8dcde;
    border:4px solid #303a40;
    clip-path:polygon(
        0 100%,
        25% 15%,
        100% 0,
        100% 100%
    );
    z-index:5;
}

.tailWing{
    position:absolute;
    left:5px;
    top:12px;
    width:25px;
    height:16px;
    background:#cbd0d3;
    border:3px solid #303a40;
    clip-path:polygon(
        0 45%,
        100% 0,
        82% 100%
    );
    z-index:3;
}

.engine{
    position:absolute;
    width:15px;
    height:11px;
    background:#68747a;
    border:3px solid #303a40;
    z-index:7;
}

.engine:after{
    content:"";
    position:absolute;
    left:2px;
    top:2px;
    width:5px;
    height:5px;
    background:#202a2f;
}

.engine1{
    left:48px;
    top:12px;
}

.engine2{
    left:48px;
    top:35px;
}

/* IMPACT */

.impactFlash{
    position:absolute;
    width:90px;
    height:90px;
    z-index:90;
    background:#fff5a0;
    clip-path:polygon(
        50% 0,
        63% 29%,
        100% 18%,
        72% 50%,
        100% 68%,
        60% 65%,
        52% 100%,
        42% 66%,
        0 80%,
        28% 51%,
        0 35%,
        39% 38%
    );
    animation:flash .22s steps(3) forwards;
}

@keyframes flash{
    from{
        transform:scale(.25);
        opacity:1;
    }

    to{
        transform:scale(2);
        opacity:0;
    }
}

/* FIRE */

.fire{
    position:absolute;
    width:32px;
    height:44px;
    z-index:35;
    animation:flicker .12s steps(2) infinite alternate;
}

.fire:before{
    content:"";
    position:absolute;
    left:5px;
    bottom:0;
    width:22px;
    height:40px;
    background:#ef3514;
    clip-path:polygon(
        50% 0,
        70% 20%,
        100% 40%,
        82% 100%,
        15% 100%,
        0 60%,
        29% 42%
    );
}

.fire:after{
    content:"";
    position:absolute;
    left:11px;
    bottom:3px;
    width:12px;
    height:26px;
    background:#ffd62b;
    clip-path:polygon(
        50% 0,
        100% 50%,
        72% 100%,
        15% 100%,
        0 55%
    );
}

.fireGlow{
    position:absolute;
    width:65px;
    height:50px;
    background:#ff5217;
    opacity:.24;
    filter:blur(8px);
    z-index:30;
}

@keyframes flicker{
    from{
        transform:scale(1);
    }

    to{
        transform:
            scale(1.1,.93)
            translateY(-2px);
    }
}

/* SMOKE */

.smoke{
    position:absolute;
    width:38px;
    height:31px;
    background:#111416;
    opacity:.96;
    z-index:40;
    box-shadow:
        25px 5px 0 #1a1d20,
        -21px 9px 0 #0c0f11,
        13px -13px 0 #202428,
        -8px -18px 0 #171a1d,
        36px -10px 0 #25292c,
        -27px -3px 0 #131618;
    animation:smokeRise 4s steps(12) forwards;
}

@keyframes smokeRise{
    0%{
        transform:
            translate(0,0)
            scale(.55);
        opacity:1;
    }

    25%{
        transform:
            translate(
                calc(var(--drift) * .35),
                -40px
            )
            scale(.9);
        opacity:.98;
    }

    55%{
        transform:
            translate(
                calc(var(--drift) * .75),
                -105px
            )
            scale(1.6);
        opacity:.94;
    }

    100%{
        transform:
            translate(
                var(--drift),
                -225px
            )
            scale(3);
        opacity:0;
    }
}

/* DEBRIS */

.debris{
    position:absolute;
    width:7px;
    height:7px;
    background:#686f73;
    z-index:50;
    animation:debris .9s steps(8) forwards;
}

@keyframes debris{
    from{
        transform:
            translate(0,0)
            rotate(0);
        opacity:1;
    }

    to{
        transform:
            translate(var(--dx),var(--dy))
            rotate(180deg);
        opacity:0;
    }
}

/* SPARKS */

.spark{
    position:absolute;
    width:5px;
    height:5px;
    background:#ffe247;
    z-index:60;
    animation:spark .7s steps(7) forwards;
}

@keyframes spark{
    to{
        transform:
            translate(var(--sx),var(--sy));
        opacity:0;
    }
}

/* EXPLOSION PARTICLES */

.explosionParticle{
    position:absolute;
    width:8px;
    height:8px;
    z-index:70;
    animation:
        explosionParticle
        .8s
        steps(8)
        forwards;
}

@keyframes explosionParticle{
    0%{
        transform:
            translate(0,0)
            scale(1);
        opacity:1;
    }

    100%{
        transform:
            translate(var(--px),var(--py))
            rotate(var(--pr))
            scale(.3);
        opacity:0;
    }
}

/* STRUCTURAL COLLAPSE */

.towerCollapsing{
    animation:
        realisticCollapse
        4.8s
        cubic-bezier(.35,.05,.7,.95)
        forwards;
}

@keyframes realisticCollapse{

    0%{
        transform:
            translate(0,0)
            rotate(0deg)
            scaleY(1);
    }

    8%{
        transform:
            translate(-2px,0)
            rotate(-.4deg)
            scaleY(1);
    }

    16%{
        transform:
            translate(3px,3px)
            rotate(.7deg)
            scaleY(.995);
    }

    25%{
        transform:
            translate(-3px,8px)
            rotate(-1deg)
            scaleY(.985);
    }

    35%{
        transform:
            translate(4px,20px)
            rotate(2deg)
            scaleY(.96);
    }

    45%{
        transform:
            translate(-3px,45px)
            rotate(-3.5deg)
            scaleY(.92);
    }

    55%{
        transform:
            translate(7px,80px)
            rotate(6deg)
            scaleY(.86);
    }

    65%{
        transform:
            translate(18px,125px)
            rotate(10deg)
            scaleY(.77);
    }

    76%{
        transform:
            translate(38px,190px)
            rotate(16deg)
            scaleY(.64);
    }

    87%{
        transform:
            translate(70px,275px)
            rotate(24deg)
            scaleY(.47);
    }

    95%{
        transform:
            translate(105px,370px)
            rotate(31deg)
            scaleY(.28);
    }

    100%{
        transform:
            translate(145px,470px)
            rotate(38deg)
            scaleY(.08);
        opacity:.25;
    }
}

/* COLLAPSE PIECES */

.collapsePiece{
    position:absolute;
    z-index:45;
    background:#bfc5c8;
    border:3px solid #777f84;
    box-shadow:
        inset 5px 0 rgba(255,255,255,.35);
    animation:
        pieceFall
        2.5s
        cubic-bezier(.25,.1,.25,1)
        forwards;
}

@keyframes pieceFall{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);
        opacity:1;
    }

    25%{
        transform:
            translate(
                calc(var(--dx)*.15),
                calc(var(--dy)*.1)
            )
            rotate(calc(var(--rot)*.15));
    }

    60%{
        transform:
            translate(
                calc(var(--dx)*.55),
                calc(var(--dy)*.55)
            )
            rotate(calc(var(--rot)*.55));
    }

    100%{
        transform:
            translate(var(--dx),var(--dy))
            rotate(var(--rot));
        opacity:0;
    }
}

/* DUST */

.collapseDust{
    position:absolute;
    width:45px;
    height:30px;
    background:#8b9295;
    opacity:.7;
    z-index:44;
    box-shadow:
        25px 5px 0 #777f82,
        -22px 10px 0 #969c9f,
        10px -13px 0 #a1a6a8;
    animation:dustRise 2.7s steps(12) forwards;
}

@keyframes dustRise{
    0%{
        transform:
            translate(0,0)
            scale(.5);
        opacity:.85;
    }

    45%{
        transform:
            translate(var(--dx),-50px)
            scale(1.6);
        opacity:.7;
    }

    100%{
        transform:
            translate(
                calc(var(--dx) * 1.7),
                -150px
            )
            scale(3.5);
        opacity:0;
    }
}

/* UI */

#status{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 14px;
    color:white;
    background:rgba(18,27,34,.84);
    border:3px solid white;
    font-size:14px;
    font-weight:bold;
    z-index:100;
    box-shadow:5px 5px 0 rgba(0,0,0,.25);
}

#targetStatus{
    position:absolute;
    top:65px;
    left:18px;
    padding:8px 12px;
    color:white;
    background:rgba(18,27,34,.76);
    border:2px solid white;
    font-size:12px;
    font-weight:bold;
    z-index:100;
}

#title{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:4px 4px 0 #354650;
    z-index:100;
    white-space:nowrap;
}

#resetButton{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:150;
    padding:15px 24px;
    background:#222c34;
    color:white;
    border:4px solid white;
    font-family:monospace;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:7px 7px 0 rgba(0,0,0,.35);
}

<script>

const game=
    document.getElementById("game");

const plane=
    document.getElementById("plane");

const statusText=
    document.getElementById("status");

const targetStatus=
    document.getElementById("targetStatus");

const resetButton=
    document.getElementById("resetButton");

const tower1=
    document.getElementById("tower1");

const tower2=
    document.getElementById("tower2");

const towerAssembly1=
    document.getElementById(
        "towerAssembly1"
    );

const towerAssembly2=
    document.getElementById(
        "towerAssembly2"
    );

const backgroundMusic=
    document.getElementById(
        "backgroundMusic"
    );

let x=0;
let y=0;

let vx=0;
let vy=0;

let crashed=false;

let musicStarted=false;

let smokeInterval=null;

let hitTower1=false;
let hitTower2=false;

let currentAssembly=null;

const keys={};

/* MUSIC */

function startMusic(){

    if(musicStarted)return;

    backgroundMusic.volume=.6;

    backgroundMusic.play().then(()=>{

        musicStarted=true;

    }).catch(()=>{

        musicStarted=false;

    });
}

/* PLANE POSITION */

function setStartPosition(){

    const w=
        window.innerWidth;

    const h=
        window.innerHeight;

    x=w*.035;
    y=h*.35;

    vx=2.5;
    vy=0;

    plane.style.position=
        "absolute";

    plane.style.left=
        x+"px";

    plane.style.top=
        y+"px";

    plane.style.zIndex=
        "80";

    plane.style.transform=
        "rotate(0deg)";

    plane.style.display=
        "block";

    if(
        plane.parentElement !== game
    ){

        game.appendChild(
            plane
        );
    }
}

/* CONTROLS */

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

        startMusic();

    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);

function holdButton(
    element,
    key
){

    const down=e=>{

        e.preventDefault();

        keys[key]=true;

        startMusic();

    };

    const up=e=>{

        e.preventDefault();

        keys[key]=false;

    };

    element.addEventListener(
        "pointerdown",
        down
    );

    element.addEventListener(
        "pointerup",
        up
    );

    element.addEventListener(
        "pointerleave",
        up
    );

    element.addEventListener(
        "pointercancel",
        up
    );
}

holdButton(
    document.getElementById("left"),
    "arrowleft"
);

holdButton(
    document.getElementById("right"),
    "arrowright"
);

holdButton(
    document.getElementById("up"),
    "arrowup"
);

holdButton(
    document.getElementById("down"),
    "arrowdown"
);

/* PLANE MOVEMENT */

function updatePlane(){

    if(crashed)return;

    if(
        Math.abs(vx)>.1 ||
        Math.abs(vy)>.1
    ){

        startMusic();

    }

    if(
        keys["arrowright"] ||
        keys["d"]
    )
        vx+=.42;

    if(
        keys["arrowleft"] ||
        keys["a"]
    )
        vx-=.42;

    if(
        keys["arrowup"] ||
        keys["w"]
    )
        vy-=.42;

    if(
        keys["arrowdown"] ||
        keys["s"]
    )
        vy+=.42;

    vx*=.93;
    vy*=.93;

    vx=Math.max(
        -7,
        Math.min(7,vx)
    );

    vy=Math.max(
        -7,
        Math.min(7,vy)
    );

    x+=vx;
    y+=vy;

    const maxX=
        window.innerWidth-
        plane.offsetWidth;

    const maxY=
        window.innerHeight-
        plane.offsetHeight;

    if(x<0){

        x=0;
        vx*=-.5;

    }

    if(x>maxX){

        x=maxX;
        vx*=-.5;

    }

    if(y<0){

        y=0;
        vy*=-.5;

    }

    if(y>maxY){

        y=maxY;
        vy*=-.5;

    }

    plane.style.left=
        x+"px";

    plane.style.top=
        y+"px";

    const angle=
        Math.max(
            -20,
            Math.min(
                20,
                vy*4
            )
        );

    plane.style.transform=
        "rotate("+angle+"deg)";

    checkCollision();
}

/* COLLISION */

function checkCollision(){

    const p=
        plane.getBoundingClientRect();

    const towers=[
        {
            tower:tower1,
            assembly:towerAssembly1,
            hit:hitTower1
        },
        {
            tower:tower2,
            assembly:towerAssembly2,
            hit:hitTower2
        }
    ];

    for(
        const item of towers
    ){

        if(item.hit)
            continue;

        if(
            item.assembly.classList.contains(
                "towerCollapsing"
            )
        )
            continue;

        const t=
            item.tower.getBoundingClientRect();

        if(
            p.right>t.left &&
            p.left<t.right &&
            p.bottom>t.top &&
            p.top<t.bottom
        ){

            crash(
                item.tower,
                item.assembly,
                p
            );

            return;
        }
    }
}

/* SCREEN SHAKE */

function shake(
    strong=false
){

    game.classList.remove(
        "shake",
        "bigShake"
    );

    void game.offsetWidth;

    game.classList.add(
        strong
        ? "bigShake"
        : "shake"
    );
}

/* CRASH */

function crash(
    tower,
    assembly,
    p
){

    if(crashed)return;

    crashed=true;

    currentAssembly=
        assembly;

    vx=0;
    vy=0;

    if(
        assembly === towerAssembly1
    ){

        hitTower1=true;

    }else{

        hitTower2=true;

    }

    updateTargetStatus();

    statusText.textContent=
        "STATUS: IMPACT";

    shake(false);

    const t=
        tower.getBoundingClientRect();

    const impactX=Math.max(
        t.left,
        Math.min(
            p.left+p.width/2,
            t.right
        )
    );

    const impactY=Math.max(
        t.top,
        Math.min(
            p.top+p.height/2,
            t.bottom
        )
    );

    /*
       Put the plane inside the building.

       It becomes a child of the tower
       assembly, so it follows the tower
       during the collapse.
    */

    const localX=
        impactX-
        t.left-
        p.width/2;

    const localY=
        impactY-
        t.top-
        p.height/2;

    assembly.appendChild(
        plane
    );

    plane.style.position=
        "absolute";

    plane.style.left=
        localX+"px";

    plane.style.top=
        localY+"px";

    /*
       Behind the tower's front layers,
       making the plane look embedded.
    */

    plane.style.zIndex=
        "2";

    plane.style.transform=
        "rotate(0deg)";

    createImpact(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    createFire(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    createSmokeCloud(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    createDebris(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    createExplosionParticles(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    spreadFire(
        assembly,
        localX+p.width/2,
        localY+p.height/2
    );

    smokeInterval=
        setInterval(()=>{

            if(!crashed){

                clearInterval(
                    smokeInterval
                );

                smokeInterval=null;

                return;
            }

            createSmoke(
                assembly,

                localX+
                p.width/2+
                (Math.random()*70-35),

                localY+
                p.height/2+
                (Math.random()*35-15)
            );

        },240);

    /*
       Let the crash settle before
       structural failure begins.
    */

    setTimeout(()=>{

        statusText.textContent=
            "STATUS: STRUCTURAL FAILURE";

        shake(true);

        collapseTower(
            assembly
        );

    },7000);
}

/* UPDATE TARGET COUNTER */

function updateTargetStatus(){

    const count=
        (hitTower1?1:0)+
        (hitTower2?1:0);

    targetStatus.textContent=
        "TOWERS: "+
        count+
        " / 2 HIT";
}

/* IMPACT FLASH */

function createImpact(
    parent,
    x,
    y
){

    const flash=
        document.createElement(
            "div"
        );

    flash.className=
        "impactFlash";

    flash.style.left=
        (x-45)+"px";

    flash.style.top=
        (y-45)+"px";

    parent.appendChild(
        flash
    );

    setTimeout(()=>{

        flash.remove();

    },250);

    for(let i=0;i<25;i++){

        const spark=
            document.createElement(
                "div"
            );

        spark.className=
            "spark";

        spark.style.left=
            x+"px";

        spark.style.top=
            y+"px";

        spark.style.setProperty(
            "--sx",
            ((Math.random()-.5)*190)+"px"
        );

        spark.style.setProperty(
            "--sy",
            ((Math.random()-.5)*150)+"px"
        );

        parent.appendChild(
            spark
        );

        setTimeout(()=>{

            spark.remove();

        },750);
    }
}

/* EXPLOSION PARTICLES */

function createExplosionParticles(
    parent,
    x,
    y
){

    const particles=[
        "#fff36b",
        "#ffb21c",
        "#ef3514",
        "#7c8589"
    ];

    for(let i=0;i<45;i++){

        const particle=
            document.createElement(
                "div"
            );

        particle.className=
            "explosionParticle";

        particle.style.left=
            x+"px";

        particle.style.top=
            y+"px";

        particle.style.background=
            particles[
                Math.floor(
                    Math.random()*
                    particles.length
                )
            ];

        particle.style.setProperty(
            "--px",
            ((Math.random()-.5)*240)+"px"
        );

        particle.style.setProperty(
            "--py",
            ((Math.random()-.5)*190)+"px"
        );

        particle.style.setProperty(
            "--pr",
            ((Math.random()-.5)*720)+"deg"
        );

        parent.appendChild(
            particle
        );

        setTimeout(()=>{

            particle.remove();

        },850);
    }
}

/* FIRE */

function createFire(
    parent,
    x,
    y
){

    const offsets=[
        [-24,-4,1],
        [0,-8,1.35],
        [24,-3,.95],
        [-13,24,.85],
        [14,25,1],
        [0,45,.75]
    ];

    for(const o of offsets){

        const fire=
            document.createElement(
                "div"
            );

        fire.className=
            "fire";

        fire.style.left=
            (x+o[0]-16)+"px";

        fire.style.top=
            (y+o[1]-40)+"px";

        fire.style.transform=
            "scale("+o[2]+")";

        parent.appendChild(
            fire
        );

        const glow=
            document.createElement(
                "div"
            );

        glow.className=
            "fireGlow";

        glow.style.left=
            (x+o[0]-32)+"px";

        glow.style.top=
            (y+o[1]-24)+"px";

        parent.appendChild(
            glow
        );
    }
}

/* FIRE SPREAD */

function spreadFire(
    parent,
    x,
    y
){

    const spots=[
        [-45,-150],
        [40,-115],
        [-35,-70],
        [48,-25],
        [-50,25],
        [30,75],
        [-20,120]
    ];

    spots.forEach(
        (spot,index)=>{

            setTimeout(()=>{

                if(!crashed)return;

                const fire=
                    document.createElement(
                        "div"
                    );

                fire.className=
                    "fire";

                fire.style.left=
                    (x+spot[0])+"px";

                fire.style.top=
                    (y+spot[1])+"px";

                fire.style.transform=
                    "scale("+
                    (.65+
                    Math.random()*.6)+
                    ")";

                parent.appendChild(
                    fire
                );

                const glow=
                    document.createElement(
                        "div"
                    );

                glow.className=
                    "fireGlow";

                glow.style.left=
                    (x+spot[0]-15)+"px";

                glow.style.top=
                    (y+spot[1]+8)+"px";

                parent.appendChild(
                    glow
                );

            },900+index*600);

        }
    );
}

/* SMOKE */

function createSmoke(
    parent,
    x,
    y
){

    const smoke=
        document.createElement(
            "div"
        );

    smoke.className=
        "smoke";

    smoke.style.left=
        (x-19)+"px";

    smoke.style.top=
        (y-18)+"px";

    /*
       Random wind direction for
       each individual smoke cloud.
    */

    smoke.style.setProperty(
        "--drift",
        ((Math.random()-.5)*150)+"px"
    );

    parent.appendChild(
        smoke
    );

    setTimeout(()=>{

        smoke.remove();

    },4100);
}

/* SMOKE CLOUD */

function createSmokeCloud(
    parent,
    x,
    y
){

    for(let i=0;i<9;i++){

        createSmoke(
            parent,
            x+
            (Math.random()*55-27),

            y+
            (Math.random()*35-12)
        );
    }
}

/* DEBRIS */

function createDebris(
    parent,
    x,
    y
){

    for(let i=0;i<20;i++){

        const d=
            document.createElement(
                "div"
            );

        d.className=
            "debris";

        d.style.left=
            x+"px";

        d.style.top=
            y+"px";

        d.style.setProperty(
            "--dx",
            ((Math.random()-.5)*190)+"px"
        );

        d.style.setProperty(
            "--dy",
            ((Math.random()-.8)*150)+"px"
        );

        parent.appendChild(
            d
        );

        setTimeout(()=>{

            d.remove();

        },950);
    }
}

/* COLLAPSE */

function collapseTower(
    assembly
){

    if(
        assembly.classList.contains(
            "towerCollapsing"
        )
    )
        return;

    assembly.classList.add(
        "towerCollapsing"
    );

    createCollapseSmoke(
        assembly
    );

    /*
       More structural debris.
    */

    for(let i=0;i<45;i++){

        const piece=
            document.createElement(
                "div"
            );

        piece.className=
            "collapsePiece";

        piece.style.width=
            (8+Math.random()*24)+"px";

        piece.style.height=
            (7+Math.random()*24)+"px";

        piece.style.left=
            Math.random()*
            assembly.offsetWidth+
            "px";

        piece.style.top=
            Math.random()*
            assembly.offsetHeight*.75+
            "px";

        piece.style.setProperty(
            "--dx",
            ((Math.random()-.5)*360)+"px"
        );

        piece.style.setProperty(
            "--dy",
            (100+Math.random()*350)+"px"
        );

        piece.style.setProperty(
            "--rot",
            ((Math.random()-.5)*900)+"deg"
        );

        assembly.appendChild(
            piece
        );

        setTimeout(()=>{

            piece.remove();

        },2600);
    }

    /*
       Dust clouds appear as the structure
       hits lower levels.
    */

    for(let i=0;i<30;i++){

        setTimeout(()=>{

            const dust=
                document.createElement(
                    "div"
                );

            dust.className=
                "collapseDust";

            dust.style.left=
                Math.random()*
                assembly.offsetWidth+
                "px";

            dust.style.top=
                assembly.offsetHeight-
                20+
                "px";

            dust.style.setProperty(
                "--dx",
                ((Math.random()-.5)*220)+"px"
            );

            assembly.appendChild(
                dust
            );

            setTimeout(()=>{

                dust.remove();

            },2800);

        },i*130);
    }

    /*
       Wait until the tower has visibly
       finished falling.
    */

    setTimeout(()=>{

        clearInterval(
            smokeInterval
        );

        smokeInterval=null;

        removeEffectsFrom(
            assembly
        );

        assembly.style.visibility=
            "hidden";

        plane.style.display=
            "none";

        if(
            hitTower1 &&
            hitTower2
        ){

            statusText.textContent=
                "STATUS: BOTH TOWERS DOWN";

            targetStatus.textContent=
                "TOWERS: 2 / 2 HIT";

            setTimeout(()=>{

                statusText.textContent=
                    "STATUS: READY AGAIN";

                resetButton.style.display=
                    "block";

            },1200);

        }else{

            /*
               Only one target has been hit.
               Spawn another plane automatically.
            */

            statusText.textContent=
                "STATUS: NEW PLANE READY";

            setTimeout(()=>{

                spawnNextPlane();

            },1200);
        }

    },5000);
}

/* COLLAPSE SMOKE */

function createCollapseSmoke(
    parent
){

    const width=
        parent.offsetWidth;

    const height=
        parent.offsetHeight;

    for(let i=0;i<28;i++){

        setTimeout(()=>{

            if(!crashed)return;

            createSmoke(
                parent,

                width/2+
                (Math.random()-.5)*
                width,

                height-
                Math.random()*350
            );

        },i*150);
    }
}

/* REMOVE EFFECTS FROM SPECIFIC TOWER */

function removeEffectsFrom(
    parent
){

    parent.querySelectorAll(
        ".fire,"+
        ".fireGlow,"+
        ".smoke,"+
        ".spark,"+
        ".debris,"+
        ".impactFlash,"+
        ".collapsePiece,"+
        ".collapseDust,"+
        ".explosionParticle"
    ).forEach(el=>{

        el.remove();

    });
}

/* NEW PLANE */

function spawnNextPlane(){

    crashed=false;

    currentAssembly=null;

    clearInterval(
        smokeInterval
    );

    smokeInterval=null;

    if(
        plane.parentElement !== game
    ){

        game.appendChild(
            plane
        );
    }

    plane.style.display=
        "block";

    plane.style.position=
        "absolute";

    plane.style.zIndex=
        "80";

    plane.style.transform=
        "rotate(0deg)";

    statusText.textContent=
        hitTower1 && !hitTower2
        ? "STATUS: HIT THE SECOND TOWER"
        : "STATUS: HIT THE FIRST TOWER";

    setStartPosition();
}

/* FULL RESET */

function resetGame(){

    crashed=false;

    currentAssembly=null;

    clearInterval(
        smokeInterval
    );

    smokeInterval=null;

    hitTower1=false;
    hitTower2=false;

    updateTargetStatus();

    removeEffectsFrom(
        towerAssembly1
    );

    removeEffectsFrom(
        towerAssembly2
    );

    towerAssembly1.classList.remove(
        "towerCollapsing"
    );

    towerAssembly2.classList.remove(
        "towerCollapsing"
    );

    towerAssembly1.style.visibility=
        "visible";

    towerAssembly2.style.visibility=
        "visible";

    game.classList.remove(
        "shake",
        "bigShake"
    );

    if(
        plane.parentElement !== game
    ){

        game.appendChild(
            plane
        );
    }

    plane.style.display=
        "block";

    plane.style.position=
        "absolute";

    plane.style.zIndex=
        "80";

    plane.style.filter=
        "drop-shadow(5px 6px 0 rgba(0,0,0,.25))";

    statusText.textContent=
        "STATUS: FLYING";

    resetButton.style.display=
        "none";

    setStartPosition();

    backgroundMusic.currentTime=
        0;

    musicStarted=false;

    startMusic();
}

/* RESET BUTTON */

resetButton.addEventListener(
    "click",
    resetGame
);

/* RESIZE */

window.addEventListener(
    "resize",
    ()=>{

        if(
            !crashed &&
            plane.parentElement===game
        ){

            setStartPosition();

        }

    }
);

setStartPosition();

backgroundMusic.volume=.6;

/* GAME LOOP */

function loop(){

    updatePlane();

    requestAnimationFrame(
        loop
    );
}

loop();

</script>

</body>
</html>
