<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STEVEN</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;

    }

    .header {
        background: #c0c0c0;
        border-bottom: 2px solid #000000;
        padding: 8px;
        font-size: 24px;
        font-weight: bold;
        color: #000080;
    }

    .content {
        padding: 15px;
    }

    .login {
        width: 100%;
        max-width: 400px;
        margin: 10px auto 25px auto;

        background: #d4d0c8;
        padding: 15px;

    .login-title {
        background: #000080;
        color: white;

        margin-top: 12px;

        cursor: pointer;
    }

    #creepyScreen {
        display: none;
        position: fixed;

        margin-top: 20vh;

</style>
</head>

<body>

<div class="main" id="mainPage">

    <div class="header">
        STEVEN
    </div>

    <div class="content">

        <div class="login">

            <div class="login-title">
                LOGIN
            </div>

            <label for="username">USERNAME:</label>
            <input type="text" id="username" autocomplete="off">

            <label for="password">PASSWORD:</label>
            <input type="password" id="password" autocomplete="off">

            <button onclick="login()">LOGIN</button>

            <div id="message"></div>

            <div id="countdown">
                20 seconds remaining
            </div>

        </div>

        <div class="photos">
            <img src="IMG_0226.jpeg">
            <img src="IMG_0333.jpeg">
            <img src="IMG_0751.jpeg">
            <img src="IMG_0752.jpeg">
            <img src="IMG_0753.jpeg">
            <img src="IMG_0754.jpeg">
        </div>

    </div>

    <div class="footer">
        This page requires a computer.
    </div>

</div>


<div id="creepyScreen">
    <h1>ACCESS DENIED</h1>

    <p>you took too long.</p>

    <p>steven was expecting you.</p>

    <p id="countdown"></p>
</div>


<audio id="music" loop>
    <source src="backgound music.mp3" type="audio/mpeg">
</audio>


<script>

let timeLeft = 20;
let allowed = false;

const timer = setInterval(function() {

    if (allowed) {
        clearInterval(timer);
        return;
    }

    timeLeft--;

    const countdowns = document.querySelectorAll("#countdown");

    countdowns.forEach(function(element) {
        element.textContent = timeLeft + " seconds remaining";
    });

    if (timeLeft <= 0) {
        clearInterval(timer);
        showCreepyScreen();
    }

}, 1000);


function login() {

    const username = document.getElementById("username").value.toLowerCase();
    const password = document.getElementById("password").value.toLowerCase();
    const message = document.getElementById("message");

    if (username.includes("steven") || password.includes("steven")) {

        allowed = true;

        message.style.color = "green";
        message.textContent = "LOGIN ACCEPTED.";

        document.getElementById("countdown").textContent = "";

        clearInterval(timer);

    } else {

        message.style.color = "red";
        message.textContent = "ACCESS DENIED.";

    }

    const music = document.getElementById("music");

    music.play().catch(function() {});

}


function showCreepyScreen() {

    document.getElementById("mainPage").style.display = "none";
    document.getElementById("creepyScreen").style.display = "block";

    const music = document.getElementById("music");

    music.play().catch(function() {});

}

</script>

</body>
</html>
